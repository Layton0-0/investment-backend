version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: investment-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: investment_portfolio
      MYSQL_USER: local_maria
      MYSQL_PASSWORD: local_maria_pass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d
    networks:
      - investment-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: investment-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - investment-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  prediction-service:
    build:
      context: ./ai-service/prediction-service
      dockerfile: Dockerfile
    container_name: investment-prediction-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - investment-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local

networks:
  investment-network:
    driver: bridge
