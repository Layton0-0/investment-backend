# 테스트 실행 시 사용. H2 인메모리 DB로 외부 DB 없이 실행.
# Flyway 검증 비활성화(이미 적용된 마이그레이션 체크섬 변경 시 실패 방지).
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
  flyway:
    enabled: false
  cache:
    type: none
  data:
    redis:
      host: localhost
      port: 6379

# MarketDataClient 빈 로드 (KoreaInvestmentMarketDataClient 조건 충족)
investment:
  market-data:
    provider: korea-investment
