<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div class="app-header" th:fragment="header">
        <div class="header-content">
            <div>
                <a th:href="@{/(serverType=${currentServerType})}" class="logo-link"><h1>Investment Choi</h1></a>
                <div class="welcome" th:if="${userInfo}">
                    안녕하세요, <strong th:text="${userInfo.username}"></strong>님
                </div>
                <div class="welcome" th:unless="${userInfo}">
                    자동투자 시스템에 오신 것을 환영합니다
                </div>
            </div>
            <div class="user-info">
                <!-- 계좌 타입 선택 (설정 제외 메뉴 데이터용): 클릭 시 모의/실 선택 후 적용 -->
                <div th:if="${userInfo != null}" class="header-account-type" th:attr="data-current-path=${currentPath}, data-current-server-type=${currentServerType}">
                    <button type="button" class="header-account-type-trigger" id="headerAccountTypeTrigger" aria-expanded="false" aria-haspopup="true">
                        <span class="header-account-type-label" th:text="${currentServerType == '1'} ? '모의계좌' : '실계좌'">모의계좌</span>
                        <span class="header-account-type-arrow" aria-hidden="true">▼</span>
                    </button>
                    <div class="header-account-type-dropdown" id="headerAccountTypeDropdown" role="dialog" aria-label="계좌 타입 선택" hidden>
                        <label class="header-account-type-option">
                            <input type="radio" name="headerServerType" value="1" th:checked="${currentServerType == '1'}"> 모의계좌
                        </label>
                        <label class="header-account-type-option">
                            <input type="radio" name="headerServerType" value="0" th:checked="${currentServerType == '0'}"> 실계좌
                        </label>
                        <button type="button" class="header-account-type-apply" id="headerAccountTypeApply">적용</button>
                    </div>
                </div>
                <span class="user-badge" th:if="${userInfo}" th:text="${userInfo.brokerTypeName}"></span>
                <a th:href="@{/mypage(serverType=${currentServerType})}" class="header-link">마이페이지</a>
                <a href="#" onclick="logout(); return false;" class="header-link">로그아웃</a>
            </div>
        </div>
    </div>
    <script th:if="${userInfo != null}">
        (function() {
            var trigger = document.getElementById('headerAccountTypeTrigger');
            var dropdown = document.getElementById('headerAccountTypeDropdown');
            var applyBtn = document.getElementById('headerAccountTypeApply');
            var wrapper = trigger && trigger.closest('.header-account-type');
            if (!trigger || !dropdown || !wrapper) return;
            var getPath = function() { return wrapper.getAttribute('data-current-path') || '/dashboard'; };
            trigger.addEventListener('click', function(e) {
                e.stopPropagation();
                var isOpen = dropdown.getAttribute('hidden') === null;
                if (isOpen) {
                    dropdown.setAttribute('hidden', '');
                    trigger.setAttribute('aria-expanded', 'false');
                } else {
                    dropdown.removeAttribute('hidden');
                    trigger.setAttribute('aria-expanded', 'true');
                }
            });
            applyBtn.addEventListener('click', function() {
                var radio = dropdown.querySelector('input[name="headerServerType"]:checked');
                if (radio) {
                    var path = getPath();
                    var sep = path.indexOf('?') >= 0 ? '&' : '?';
                    window.location.href = path + sep + 'serverType=' + radio.value;
                }
            });
            document.addEventListener('click', function() {
                dropdown.setAttribute('hidden', '');
                trigger.setAttribute('aria-expanded', 'false');
            });
            dropdown.addEventListener('click', function(e) { e.stopPropagation(); });
        })();
    </script>
</body>
</html>
