<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - Investment Choi</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body class="auth-background">
    <div class="auth-container register-container">
        <h1>회원가입</h1>
        <p class="subtitle">Investment Choi에 오신 것을 환영합니다</p>
        
        <div class="security-note">
            ⚠️ 보안 안내: 입력하신 API Key와 Secret은 암호화되어 저장되며, 화면에 표시되지 않습니다.
        </div>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="username">사용자 ID</label>
                <input type="text" id="username" name="username" required autocomplete="username" 
                       pattern="[a-zA-Z0-9_]+" minlength="4" maxlength="50" placeholder="영문, 숫자, 언더스코어만 사용">
                <div class="info-text">4-50자, 영문/숫자/언더스코어만 사용 가능</div>
                <div class="error-message" id="usernameError"></div>
            </div>
            
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" required autocomplete="new-password" 
                       minlength="8" maxlength="100" placeholder="8자 이상 입력해주세요">
                <div class="info-text">8자 이상 입력해주세요</div>
                <div class="error-message" id="passwordError"></div>
            </div>
            
            <div class="form-group">
                <label for="brokerType">사용증권명</label>
                <select id="brokerType" name="brokerType" required>
                    <option value="">선택하세요</option>
                    <option th:each="broker : ${brokerTypes}" 
                            th:value="${broker.code}" 
                            th:text="${broker.name}"></option>
                </select>
                <div class="error-message" id="brokerTypeError"></div>
            </div>
            
            <div class="form-group">
                <label for="appKey">API Key</label>
                <input type="password" id="appKey" name="appKey" required autocomplete="off" placeholder="API Key를 입력하세요">
                <div class="info-text">민감 정보이므로 화면에 표시되지 않습니다</div>
                <div class="error-message" id="appKeyError"></div>
            </div>
            
            <div class="form-group">
                <label for="appSecret">API Secret</label>
                <input type="password" id="appSecret" name="appSecret" required autocomplete="off" placeholder="API Secret을 입력하세요">
                <div class="info-text">민감 정보이므로 화면에 표시되지 않습니다</div>
                <div class="error-message" id="appSecretError"></div>
            </div>
            
            <div class="form-group">
                <label for="serverType">서버 타입</label>
                <select id="serverType" name="serverType" required>
                    <option value="1">모의투자</option>
                    <option value="0">실거래</option>
                </select>
                <div class="info-text">모의투자로 시작하는 것을 권장합니다</div>
            </div>
            
            <div class="error-message" id="generalError"></div>
            
            <button type="submit" class="full-width" id="registerButton">회원가입</button>
        </form>
        
        <div class="link-text">
            이미 계정이 있으신가요? <a href="/login">로그인</a>
        </div>
    </div>
    
    <script th:src="@{/js/validation.js}"></script>
    <script>
        const registerForm = document.getElementById('registerForm');
        const registerButton = document.getElementById('registerButton');
        const generalError = document.getElementById('generalError');
        
        // 실시간 유효성 검사 설정
        setupRealTimeValidation('username', validateUsername, 'usernameError');
        setupRealTimeValidation('password', (pwd) => validatePassword(pwd, true), 'passwordError');
        setupRealTimeValidation('appKey', (key) => validateAppKey(key, true), 'appKeyError');
        setupRealTimeValidation('appSecret', (secret) => validateAppSecret(secret, true), 'appSecretError');
        
        // select 필드 유효성 검사
        const brokerTypeField = document.getElementById('brokerType');
        brokerTypeField.addEventListener('change', () => {
            const result = validateBrokerType(brokerTypeField.value, true);
            if (result.valid) {
                showFieldSuccess('brokerType', 'brokerTypeError');
            } else {
                showFieldError('brokerType', 'brokerTypeError', result.message);
            }
        });
        
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 에러 메시지 초기화
            clearAllErrors();
            
            const formData = {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value,
                brokerType: document.getElementById('brokerType').value,
                appKey: document.getElementById('appKey').value,
                appSecret: document.getElementById('appSecret').value,
                serverType: document.getElementById('serverType').value
            };
            
            // 유효성 검사
            let isValid = true;
            
            const usernameValidation = validateUsername(formData.username);
            if (!usernameValidation.valid) {
                showFieldError('username', 'usernameError', usernameValidation.message);
                isValid = false;
            }
            
            const passwordValidation = validatePassword(formData.password, true);
            if (!passwordValidation.valid) {
                showFieldError('password', 'passwordError', passwordValidation.message);
                isValid = false;
            }
            
            const brokerTypeValidation = validateBrokerType(formData.brokerType, true);
            if (!brokerTypeValidation.valid) {
                showFieldError('brokerType', 'brokerTypeError', brokerTypeValidation.message);
                isValid = false;
            }
            
            const appKeyValidation = validateAppKey(formData.appKey, true);
            if (!appKeyValidation.valid) {
                showFieldError('appKey', 'appKeyError', appKeyValidation.message);
                isValid = false;
            }
            
            const appSecretValidation = validateAppSecret(formData.appSecret, true);
            if (!appSecretValidation.valid) {
                showFieldError('appSecret', 'appSecretError', appSecretValidation.message);
                isValid = false;
            }
            
            const serverTypeValidation = validateServerType(formData.serverType, true);
            if (!serverTypeValidation.valid) {
                generalError.textContent = serverTypeValidation.message;
                generalError.classList.add('show');
                isValid = false;
            }
            
            if (!isValid) {
                return;
            }
            
            registerButton.disabled = true;
            registerButton.textContent = '회원가입 중...';
            
            try {
                const response = await fetch('/api/v1/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // JWT 토큰을 localStorage에 저장
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userId', data.userId);
                    localStorage.setItem('username', data.username);
                    
                    // 대시보드로 리다이렉트
                    window.location.href = '/dashboard';
                } else {
                    const errorMessage = data.message || '회원가입에 실패했습니다.';
                    generalError.textContent = errorMessage;
                    generalError.classList.add('show');
                    registerButton.disabled = false;
                    registerButton.textContent = '회원가입';
                }
            } catch (error) {
                generalError.textContent = '회원가입 중 오류가 발생했습니다.';
                generalError.classList.add('show');
                registerButton.disabled = false;
                registerButton.textContent = '회원가입';
            }
        });
    </script>
</body>
</html>
