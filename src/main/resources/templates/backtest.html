<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>백테스트 - Investment Choi</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        #result-section { display: none; }
        .result-mode-robo #pipeline-results { display: none; }
        .result-mode-robo #robo-results { display: block; }
        .result-mode-pipeline #robo-results { display: none; }
        .result-mode-pipeline #pipeline-results { display: block; }
        #robo-results { display: none; }
    </style>
</head>
<body class="page-background">
    <div th:replace="~{fragments/layout-header :: header}"></div>
    <nav th:replace="~{fragments/layout-menu :: menu}"></nav>

    <main class="container">
        <div class="mode-tabs">
            <span class="mode-tab active" data-mode="pipeline">4단계 파이프라인 백테스트</span>
            <span class="mode-tab" data-mode="robo">로보어드바이저 백테스트</span>
        </div>

        <div class="card">
            <h2>실행 조건</h2>
            <div id="form-panel-pipeline" class="form-panel active">
                <form id="backtest-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="startDate">시작일</label>
                            <input type="date" id="startDate" name="startDate" required>
                        </div>
                        <div class="form-group">
                            <label for="endDate">종료일</label>
                            <input type="date" id="endDate" name="endDate" required>
                        </div>
                        <div class="form-group">
                            <label for="market">시장</label>
                            <select id="market" name="market">
                                <option value="KR">KR (한국)</option>
                                <option value="US">US (미국)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="strategyType">전략</label>
                            <select id="strategyType" name="strategyType">
                                <option value="SHORT_TERM">단기 (SHORT_TERM)</option>
                                <option value="MEDIUM_TERM">중기 (MEDIUM_TERM)</option>
                                <option value="LONG_TERM">장기 (LONG_TERM)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="initialCapital">초기 자본 (원)</label>
                            <input type="text" id="initialCapital" name="initialCapital" inputmode="numeric" placeholder="예: 100000000" required>
                            <span id="initialCapitalWon" class="capital-readout" aria-live="polite"></span>
                        </div>
                        <div class="form-group">
                            <button type="submit" class="btn" id="run-btn">실행</button>
                        </div>
                    </div>
                    <div id="form-error" class="error-msg"></div>
                </form>
            </div>
            <div id="form-panel-robo" class="form-panel">
                <form id="robo-backtest-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="roboStartDate">시작일</label>
                            <input type="date" id="roboStartDate" name="roboStartDate" required>
                        </div>
                        <div class="form-group">
                            <label for="roboEndDate">종료일</label>
                            <input type="date" id="roboEndDate" name="roboEndDate" required>
                        </div>
                        <div class="form-group">
                            <label for="roboInitialCapital">초기 자본 (원)</label>
                            <input type="text" id="roboInitialCapital" name="roboInitialCapital" inputmode="numeric" placeholder="예: 100000000" required>
                            <span id="roboInitialCapitalWon" class="capital-readout" aria-live="polite"></span>
                        </div>
                        <div class="form-group">
                            <button type="submit" class="btn" id="robo-run-btn">실행</button>
                            <button type="button" class="btn btn-secondary" id="robo-collect-us-daily-btn">US 일봉 수집</button>
                        </div>
                    </div>
                    <div id="robo-collect-message" class="help-text" style="margin-top: 8px; display: none;" aria-live="polite"></div>
                    <div class="advanced-toggle">
                        <button type="button" class="btn-link" id="robo-advanced-toggle">고급 설정 펼치기</button>
                    </div>
                    <div id="robo-advanced" class="advanced-section">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="roboMomentumMonths">모멘텀 기간 (개월)</label>
                                <input type="number" id="roboMomentumMonths" min="1" max="24" value="12">
                                <div class="help-text">11/12/13개월 결과가 비슷해야 전략이 견고합니다.</div>
                            </div>
                            <div class="form-group">
                                <label for="roboMaWindowDays">이동평균 창 (일)</label>
                                <input type="number" id="roboMaWindowDays" min="20" max="500" value="200">
                            </div>
                            <div class="form-group">
                                <label for="roboTopN">상위 N개 자산</label>
                                <input type="number" id="roboTopN" min="1" max="10" value="4">
                            </div>
                            <div class="form-group">
                                <label for="roboRebalanceFreq">리밸런싱 주기</label>
                                <select id="roboRebalanceFreq">
                                    <option value="MONTHLY">월간</option>
                                    <option value="QUARTERLY">분기</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="roboCommPct">수수료 (%)</label>
                                <input type="number" id="roboCommPct" min="0" step="0.01" value="0.1">
                            </div>
                            <div class="form-group">
                                <label for="roboSlipPct">슬리피지 (%)</label>
                                <input type="number" id="roboSlipPct" min="0" step="0.01" value="0.2">
                            </div>
                        </div>
                    </div>
                    <div id="robo-form-error" class="error-msg"></div>
                </form>
            </div>
        </div>

        <div id="result-section" class="card">
            <h2>결과 요약</h2>
            <div id="robo-results">
                <div id="robo-warning" class="warning-msg" role="alert" style="display: none;"></div>
                <div id="robo-interpretation" class="interpretation"></div>
                <div id="robo-metrics-container" class="metrics-grid"></div>
                <h2 style="margin-top: 24px;">수익 곡선 (전략 vs 벤치마크)</h2>
                <div id="robo-equity-container"></div>
                <h2 style="margin-top: 24px;">리밸런싱 이력</h2>
                <div id="robo-rebalance-container"></div>
            </div>
            <div id="pipeline-results">
                <div id="metrics-container" class="metrics-grid"></div>
                <h2 style="margin-top: 24px;">수익 곡선 (일자별 자산)</h2>
                <div id="equity-container"></div>
                <h2 style="margin-top: 24px;">거래 목록</h2>
                <div id="trades-container"></div>
            </div>
        </div>
    </main>

    <script th:inline="javascript">
        (function() {
            var CAPITAL_MAX = 1e12; // 1조원 상한

            function formatIntegerWithCommas(num) {
                if (num == null || isNaN(num) || num < 0) return '';
                var s = String(Math.floor(num));
                var i = s.length % 3;
                var head = i === 0 ? '' : s.slice(0, i);
                var tail = s.slice(i).replace(/(\d{3})/g, ',$1');
                return head ? head + tail : tail.slice(1);
            }

            function parseCapitalInput(raw) {
                if (raw == null || typeof raw !== 'string') return NaN;
                var cleaned = raw.replace(/[\s,]/g, '');
                if (cleaned === '') return NaN;
                var n = parseInt(cleaned, 10);
                return isNaN(n) ? NaN : n;
            }

            function formatManwon(amountWon) {
                if (amountWon == null || isNaN(amountWon) || amountWon < 0) return '';
                var man = Math.floor(amountWon / 10000);
                return formatIntegerWithCommas(man) + '만원';
            }

            function attachCapitalFormatAndValidation(inputId, readoutId) {
                var input = document.getElementById(inputId);
                var readout = document.getElementById(readoutId);
                if (!input || !readout) return;
                function updateReadout() {
                    var parsed = parseCapitalInput(input.value);
                    readout.textContent = parsed >= 0 && !isNaN(parsed) ? formatManwon(parsed) : '';
                }
                function formatInput() {
                    var parsed = parseCapitalInput(input.value);
                    if (!isNaN(parsed) && parsed >= 0) {
                        var start = input.selectionStart;
                        var oldLen = input.value.length;
                        input.value = formatIntegerWithCommas(parsed);
                        var newLen = input.value.length;
                        var newStart = Math.max(0, start + (newLen - oldLen));
                        input.setSelectionRange(newStart, newStart);
                    }
                    updateReadout();
                }
                input.addEventListener('input', formatInput);
                input.addEventListener('blur', function() {
                    var parsed = parseCapitalInput(input.value);
                    if (!isNaN(parsed) && parsed >= 0) input.value = formatIntegerWithCommas(parsed);
                    updateReadout();
                });
                updateReadout();
            }

            var currentMode = 'pipeline';
            var form = document.getElementById('backtest-form');
            var roboForm = document.getElementById('robo-backtest-form');
            var resultSection = document.getElementById('result-section');
            var runBtn = document.getElementById('run-btn');
            var roboRunBtn = document.getElementById('robo-run-btn');
            var formError = document.getElementById('form-error');
            var roboFormError = document.getElementById('robo-form-error');
            var metricsContainer = document.getElementById('metrics-container');
            var equityContainer = document.getElementById('equity-container');
            var tradesContainer = document.getElementById('trades-container');

            (function setDefaultDates() {
                var endStr = new Date().toISOString().slice(0, 10);
                var endDate = new Date(endStr + 'T12:00:00');
                endDate.setMonth(endDate.getMonth() - 1);
                var startStr = endDate.toISOString().slice(0, 10);
                var startEl = document.getElementById('startDate');
                var endEl = document.getElementById('endDate');
                var roboStartEl = document.getElementById('roboStartDate');
                var roboEndEl = document.getElementById('roboEndDate');
                if (startEl) startEl.value = startStr;
                if (endEl) endEl.value = endStr;
                if (roboStartEl) roboStartEl.value = startStr;
                if (roboEndEl) roboEndEl.value = endStr;
            })();
            document.getElementById('initialCapital').value = formatIntegerWithCommas(100000000);
            document.getElementById('roboInitialCapital').value = formatIntegerWithCommas(100000000);
            attachCapitalFormatAndValidation('initialCapital', 'initialCapitalWon');
            attachCapitalFormatAndValidation('roboInitialCapital', 'roboInitialCapitalWon');

            document.querySelectorAll('.mode-tab').forEach(function(tab) {
                tab.addEventListener('click', function() {
                    var mode = this.getAttribute('data-mode');
                    currentMode = mode;
                    document.querySelectorAll('.mode-tab').forEach(function(t) { t.classList.remove('active'); });
                    this.classList.add('active');
                    document.querySelectorAll('.form-panel').forEach(function(p) { p.classList.remove('active'); });
                    document.getElementById('form-panel-' + mode).classList.add('active');
                    resultSection.classList.remove('result-mode-pipeline', 'result-mode-robo');
                    resultSection.classList.add('result-mode-' + mode);
                });
            });

            document.getElementById('robo-advanced-toggle').addEventListener('click', function() {
                var adv = document.getElementById('robo-advanced');
                adv.classList.toggle('open');
                this.textContent = adv.classList.contains('open') ? '고급 설정 접기' : '고급 설정 펼치기';
            });

            var roboCollectBtn = document.getElementById('robo-collect-us-daily-btn');
            var roboCollectMsg = document.getElementById('robo-collect-message');
            if (roboCollectBtn && roboCollectMsg) {
                roboCollectBtn.addEventListener('click', function() {
                    var startInput = document.getElementById('roboStartDate').value;
                    var endInput = document.getElementById('roboEndDate').value;
                    var endDate = endInput || new Date().toISOString().slice(0, 10);
                    var startDate = startInput || (function() {
                        var d = new Date(endDate);
                        d.setDate(d.getDate() - 29);
                        return d.toISOString().slice(0, 10);
                    })();
                    if (new Date(startDate) > new Date(endDate)) {
                        startDate = endDate;
                    }
                    roboCollectMsg.style.display = 'none';
                    roboCollectMsg.textContent = '';
                    roboCollectBtn.disabled = true;
                    roboCollectMsg.textContent = '수집 요청 중...';
                    roboCollectMsg.style.display = 'block';
                    fetch('/api/v1/backtest/robo/collect-us-daily', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ startDate: startDate, endDate: endDate })
                    }).then(function(res) {
                        if (!res.ok) return res.json().then(function(err) { throw err; }).catch(function() { throw new Error('요청 실패: ' + res.status); });
                        return res.json();
                    }).then(function(data) {
                        if (data.message) {
                            roboCollectMsg.textContent = data.message;
                        } else {
                            roboCollectMsg.textContent = '수집 완료: ' + data.collectedDays + '일, 총 ' + (data.savedTotal || 0) + '건 저장.';
                        }
                    }).catch(function(err) {
                        roboCollectMsg.textContent = err.message || 'US 일봉 수집 중 오류가 발생했습니다.';
                    }).finally(function() {
                        roboCollectBtn.disabled = false;
                    });
                });
            }

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                formError.textContent = '';
                var startDate = document.getElementById('startDate').value;
                var endDate = document.getElementById('endDate').value;
                var market = document.getElementById('market').value;
                var strategyType = document.getElementById('strategyType').value;
                var initialCapitalRaw = document.getElementById('initialCapital').value;
                var initialCapital = parseCapitalInput(initialCapitalRaw);
                if (!startDate || !endDate) {
                    formError.textContent = '시작일·종료일을 입력하세요.';
                    return;
                }
                if (isNaN(initialCapital) || initialCapital < 1) {
                    formError.textContent = '초기 자본은 1원 이상의 금액을 입력하세요.';
                    return;
                }
                if (initialCapital > CAPITAL_MAX) {
                    formError.textContent = '초기 자본은 1조원 이하로 입력하세요.';
                    return;
                }
                if (new Date(startDate) > new Date(endDate)) {
                    formError.textContent = '시작일은 종료일 이전이어야 합니다.';
                    return;
                }
                runBtn.disabled = true;
                fetch('/api/v1/backtest', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        startDate: startDate,
                        endDate: endDate,
                        market: market,
                        strategyType: strategyType,
                        initialCapital: initialCapital
                    })
                }).then(function(res) {
                    if (!res.ok) return res.json().then(function(err) { throw err; }).catch(function() { throw new Error('요청 실패: ' + res.status); });
                    return res.json();
                }).then(function(data) {
                    resultSection.style.display = 'block';
                    resultSection.classList.remove('result-mode-robo');
                    resultSection.classList.add('result-mode-pipeline');
                    renderMetrics(data);
                    renderEquity(data.equityCurve);
                    renderTrades(data.trades);
                }).catch(function(err) {
                    formError.textContent = err.message || '백테스트 실행 중 오류가 발생했습니다.';
                }).finally(function() {
                    runBtn.disabled = false;
                });
            });

            roboForm.addEventListener('submit', function(e) {
                e.preventDefault();
                roboFormError.textContent = '';
                var startDate = document.getElementById('roboStartDate').value;
                var endDate = document.getElementById('roboEndDate').value;
                var initialCapitalRaw = document.getElementById('roboInitialCapital').value;
                var initialCapital = parseCapitalInput(initialCapitalRaw);
                if (!startDate || !endDate) {
                    roboFormError.textContent = '시작일·종료일을 입력하세요.';
                    return;
                }
                if (isNaN(initialCapital) || initialCapital < 1) {
                    roboFormError.textContent = '초기 자본은 1원 이상의 금액을 입력하세요.';
                    return;
                }
                if (initialCapital > CAPITAL_MAX) {
                    roboFormError.textContent = '초기 자본은 1조원 이하로 입력하세요.';
                    return;
                }
                if (new Date(startDate) > new Date(endDate)) {
                    roboFormError.textContent = '시작일은 종료일 이전이어야 합니다.';
                    return;
                }
                var body = {
                    startDate: startDate,
                    endDate: endDate,
                    initialCapital: initialCapital
                };
                if (document.getElementById('robo-advanced').classList.contains('open')) {
                    body.momentumMonths = parseInt(document.getElementById('roboMomentumMonths').value, 10) || 12;
                    body.maWindowDays = parseInt(document.getElementById('roboMaWindowDays').value, 10) || 200;
                    body.topN = parseInt(document.getElementById('roboTopN').value, 10) || 4;
                    body.rebalanceFrequency = document.getElementById('roboRebalanceFreq').value || 'MONTHLY';
                    body.commPct = parseFloat(document.getElementById('roboCommPct').value) || 0.1;
                    body.slipPct = parseFloat(document.getElementById('roboSlipPct').value) || 0.2;
                }
                roboRunBtn.disabled = true;
                fetch('/api/v1/backtest/robo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(body)
                }).then(function(res) {
                    if (!res.ok) return res.json().then(function(err) { throw err; }).catch(function() { throw new Error('요청 실패: ' + res.status); });
                    return res.json();
                }).then(function(data) {
                    resultSection.style.display = 'block';
                    resultSection.classList.remove('result-mode-pipeline');
                    resultSection.classList.add('result-mode-robo');
                    var warningEl = document.getElementById('robo-warning');
                    if (warningEl) {
                        if (data.warningMessage) {
                            warningEl.textContent = data.warningMessage;
                            warningEl.style.display = 'block';
                        } else {
                            warningEl.textContent = '';
                            warningEl.style.display = 'none';
                        }
                    }
                    renderRoboInterpretation(data);
                    renderRoboMetrics(data);
                    renderRoboEquity(data.equityCurve, data.benchmarkCurve);
                    renderRoboRebalance(data.rebalanceHistory);
                }).catch(function(err) {
                    roboFormError.textContent = err.message || '백테스트 실행 중 오류가 발생했습니다. 선택한 기간에 자산/벤치마크 데이터가 없을 수 있습니다.';
                }).finally(function() {
                    roboRunBtn.disabled = false;
                });
            });

            function fmt(v) { return v == null ? '-' : (typeof v === 'number' ? v.toLocaleString() : v); }
            function fmtPct(v) { return v == null ? '-' : (typeof v === 'number' ? v.toFixed(2) + '%' : v); }

            function renderMetrics(data) {
                var items = [
                    { label: '최종 자산', value: fmt(data.finalEquity) },
                    { label: '총 수익률', value: fmtPct(data.totalReturnPct) },
                    { label: 'CAGR', value: fmtPct(data.cagr) },
                    { label: 'MDD', value: fmtPct(data.mddPct) },
                    { label: 'Sharpe', value: fmt(data.sharpeRatio) },
                    { label: 'Sortino', value: fmt(data.sortinoRatio) },
                    { label: 'Calmar', value: fmt(data.calmarRatio) },
                    { label: '승률 (p)', value: data.winRate != null ? (data.winRate * 100).toFixed(1) + '%' : '-' },
                    { label: '손익비 (b)', value: fmt(data.profitFactor) },
                    { label: '거래 수', value: data.tradeCount }
                ];
                metricsContainer.innerHTML = items.map(function(i) {
                    return '<div class="metric-item"><div class="label">' + i.label + '</div><div class="value">' + i.value + '</div></div>';
                }).join('');
            }

            function renderRoboInterpretation(data) {
                var cagr = data.cagr != null ? Number(data.cagr).toFixed(1) : '-';
                var mdd = data.mddPct != null ? Number(data.mddPct).toFixed(1) : '-';
                var sharpe = data.sharpeRatio != null ? Number(data.sharpeRatio).toFixed(2) : '-';
                var turnover = data.turnover != null ? Number(data.turnover).toFixed(1) : '-';
                var level = '양호';
                if (data.mddPct != null && data.mddPct < -15) level = '주의';
                if (data.sharpeRatio != null && data.sharpeRatio < 0.5) level = '주의';
                var text = '연평균 수익률 ' + cagr + '%, 최대 낙폭 ' + mdd + '%. 변동성 대비 수익(샤프) ' + sharpe + '로 ' + level + '합니다. 연간 회전율 ' + turnover + '%.';
                document.getElementById('robo-interpretation').textContent = text;
            }

            function renderRoboMetrics(data) {
                var items = [
                    { label: '최종 자산', value: fmt(data.finalEquity), cls: '' },
                    { label: '총 수익률', value: fmtPct(data.totalReturnPct), cls: '' },
                    { label: 'CAGR', value: fmtPct(data.cagr), cls: data.cagr != null && data.cagr >= 10 ? 'good' : '' },
                    { label: 'MDD', value: fmtPct(data.mddPct), cls: data.mddPct != null && data.mddPct < -15 ? 'bad' : (data.mddPct != null && data.mddPct > -10 ? 'good' : '') },
                    { label: 'Sharpe', value: fmt(data.sharpeRatio), cls: data.sharpeRatio != null && data.sharpeRatio >= 1 ? 'good' : (data.sharpeRatio != null && data.sharpeRatio < 0.5 ? 'warn' : '') },
                    { label: 'Calmar', value: fmt(data.calmarRatio), cls: '' },
                    { label: '회전율 (연)', value: fmtPct(data.turnover), cls: '' },
                    { label: '벤치마크 CAGR', value: fmtPct(data.benchmarkCagr), cls: '' },
                    { label: '벤치마크 MDD', value: fmtPct(data.benchmarkMddPct), cls: '' }
                ];
                document.getElementById('robo-metrics-container').innerHTML = items.map(function(i) {
                    return '<div class="metric-item' + (i.cls ? ' ' + i.cls : '') + '"><div class="label">' + i.label + '</div><div class="value">' + i.value + '</div></div>';
                }).join('');
            }

            function renderRoboEquity(equityCurve, benchmarkCurve) {
                var container = document.getElementById('robo-equity-container');
                if (!equityCurve || equityCurve.length === 0) {
                    container.innerHTML = '<div class="empty-state">수익 곡선 데이터가 없습니다.</div>';
                    return;
                }
                var maxShow = 100;
                var rows = equityCurve.length > maxShow ? equityCurve.slice(-maxShow) : equityCurve;
                var benchMap = {};
                if (benchmarkCurve && benchmarkCurve.length) {
                    benchmarkCurve.forEach(function(p) { benchMap[p.date] = p.equity; });
                }
                var html = '<table class="data-table"><thead><tr><th>일자</th><th>전략 자산</th><th>벤치마크</th></tr></thead><tbody>';
                rows.forEach(function(p) {
                    var bench = benchMap[p.date] != null ? Number(benchMap[p.date]).toLocaleString() : '-';
                    html += '<tr><td>' + p.date + '</td><td>' + (p.equity != null ? Number(p.equity).toLocaleString() : '-') + '</td><td>' + bench + '</td></tr>';
                });
                html += '</tbody></table>';
                if (equityCurve.length > maxShow) html += '<p class="empty-state">최근 ' + maxShow + '일만 표시합니다.</p>';
                container.innerHTML = html;
            }

            function renderRoboRebalance(history) {
                var container = document.getElementById('robo-rebalance-container');
                if (!history || history.length === 0) {
                    container.innerHTML = '<div class="empty-state">리밸런싱 이력이 없습니다.</div>';
                    return;
                }
                var html = '<table class="data-table"><thead><tr><th>일자</th><th>자산별 비중</th><th>현금(%)</th><th>회전율(%)</th></tr></thead><tbody>';
                history.forEach(function(h) {
                    var weightsStr = '-';
                    if (h.weights && typeof h.weights === 'object') {
                        weightsStr = Object.keys(h.weights).map(function(k) { return k + ' ' + (Number(h.weights[k]) * 100).toFixed(1) + '%'; }).join(', ');
                    }
                    var cashW = h.cashWeight != null ? (Number(h.cashWeight) * 100).toFixed(1) + '%' : '-';
                    var turn = h.turnoverPct != null ? Number(h.turnoverPct).toFixed(2) + '%' : '-';
                    html += '<tr><td>' + (h.date || '-') + '</td><td>' + weightsStr + '</td><td>' + cashW + '</td><td>' + turn + '</td></tr>';
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            }

            function renderEquity(curve) {
                if (!curve || curve.length === 0) {
                    equityContainer.innerHTML = '<div class="empty-state">수익 곡선 데이터가 없습니다.</div>';
                    return;
                }
                var maxShow = 100;
                var rows = curve.length > maxShow ? curve.slice(-maxShow) : curve;
                var html = '<table class="data-table"><thead><tr><th>일자</th><th>자산</th></tr></thead><tbody>';
                rows.forEach(function(p) {
                    html += '<tr><td>' + p.date + '</td><td>' + (p.equity != null ? Number(p.equity).toLocaleString() : '-') + '</td></tr>';
                });
                html += '</tbody></table>';
                if (curve.length > maxShow) html += '<p class="empty-state">최근 ' + maxShow + '일만 표시합니다.</p>';
                equityContainer.innerHTML = html;
            }

            function renderTrades(trades) {
                if (!trades || trades.length === 0) {
                    tradesContainer.innerHTML = '<div class="empty-state">거래 내역이 없습니다.</div>';
                    return;
                }
                var html = '<table class="data-table"><thead><tr><th>종목</th><th>진입일</th><th>청산일</th><th>진입가</th><th>청산가</th><th>수량</th><th>손익</th><th>손익률</th><th>사유</th></tr></thead><tbody>';
                trades.forEach(function(t) {
                    html += '<tr><td>' + (t.symbol || '-') + '</td><td>' + (t.entryDt || '-') + '</td><td>' + (t.exitDt || '-') + '</td><td>' + fmt(t.entryPrice) + '</td><td>' + fmt(t.exitPrice) + '</td><td>' + (t.quantity || '-') + '</td><td>' + fmt(t.pnl) + '</td><td>' + (t.pnlPct != null ? Number(t.pnlPct).toFixed(2) + '%' : '-') + '</td><td>' + (t.exitReason || '-') + '</td></tr>';
                });
                html += '</tbody></table>';
                tradesContainer.innerHTML = html;
            }
        })();
    </script>
</body>
</html>
