<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스케줄 현황 - Investment Choi</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        .page-title { font-size: 22px; font-weight: 700; margin-bottom: 24px; color: #191F28; }
        .jobs-grid { display: grid; gap: 20px; }
        .job-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .job-card:hover { box-shadow: 0 6px 12px rgba(0,0,0,0.08); }
        .job-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px; }
        .job-title h3 { font-size: 18px; color: #191F28; margin-bottom: 6px; }
        .job-title .description { font-size: 13px; color: #8B95A1; }
        .job-status { padding: 6px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .job-status.active { background: #27ae60; color: white; }
        .job-status.paused { background: #f39c12; color: white; }
        .job-status.disabled { background: #95a5a6; color: white; }
        .job-info { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 15px; }
        .info-item { background: #f8f9fa; padding: 12px; border-radius: 8px; border-left: 4px solid #3182F6; }
        .info-item label { display: block; font-size: 11px; color: #8B95A1; margin-bottom: 4px; text-transform: uppercase; }
        .info-item .value { font-size: 14px; font-weight: 600; color: #191F28; }
        .info-item.cron .value { font-family: 'Courier New', monospace; }
        .stats { display: flex; gap: 12px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }
        .stat-item { flex: 1; text-align: center; padding: 10px; background: #f8f9fa; border-radius: 8px; }
        .stat-item label { display: block; font-size: 11px; color: #8B95A1; margin-bottom: 4px; }
        .stat-item .value { font-size: 16px; font-weight: 700; color: #3182F6; }
        .empty-state { text-align: center; padding: 48px 24px; color: #8B95A1; }
    </style>
</head>
<body class="page-background">
    <div th:replace="~{fragments/layout-header :: header}"></div>
    <nav th:replace="~{fragments/layout-menu :: menu}"></nav>

    <div class="container">
        <h2 class="page-title">스케줄 현황</h2>

        <div th:if="${jobs != null and !jobs.isEmpty()}">
            <div class="jobs-grid">
                <div class="job-card" th:each="job : ${jobs}">
                    <div class="job-header">
                        <div class="job-title">
                            <h3 th:text="${job.name}"></h3>
                            <div class="description" th:text="${job.description}"></div>
                        </div>
                        <span class="job-status"
                              th:classappend="${job.status == 'ACTIVE' ? 'active' : (job.status == 'PAUSED' ? 'paused' : 'disabled')}"
                              th:text="${job.status}"></span>
                    </div>
                    <div class="job-info">
                        <div class="info-item cron">
                            <label>Cron 표현식</label>
                            <div class="value" th:text="${job.cronExpression}"></div>
                        </div>
                        <div class="info-item">
                            <label>시간대</label>
                            <div class="value" th:text="${job.timeZone}"></div>
                        </div>
                        <div class="info-item" th:if="${job.nextExecutionTime}">
                            <label>다음 실행 시간</label>
                            <div class="value" th:text="${#temporals.format(job.nextExecutionTime, 'yyyy-MM-dd HH:mm')}"></div>
                        </div>
                        <div class="info-item" th:if="${job.lastExecutionTime}">
                            <label>마지막 실행 시간</label>
                            <div class="value" th:text="${#temporals.format(job.lastExecutionTime, 'yyyy-MM-dd HH:mm')}"></div>
                        </div>
                    </div>
                    <div class="stats">
                        <div class="stat-item">
                            <label>총 실행 횟수</label>
                            <div class="value" th:text="${job.executionCount != null ? job.executionCount : 0}"></div>
                        </div>
                        <div class="stat-item">
                            <label>성공 횟수</label>
                            <div class="value" style="color: #27ae60;" th:text="${job.successCount != null ? job.successCount : 0}"></div>
                        </div>
                        <div class="stat-item">
                            <label>실패 횟수</label>
                            <div class="value" style="color: #e74c3c;" th:text="${job.failureCount != null ? job.failureCount : 0}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${jobs == null or jobs.isEmpty()}" class="empty-state">
            <h2>등록된 스케줄 작업이 없습니다.</h2>
        </div>
    </div>
</body>
</html>
