<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스케줄 현황 - Investment Choi</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body class="page-background">
    <div th:replace="~{fragments/layout-header :: header}"></div>
    <nav th:replace="~{fragments/layout-menu :: menu}"></nav>

    <main class="container">
        <div th:if="${jobs != null and !jobs.isEmpty()}">
            <div class="jobs-grid">
                <div class="job-card" th:each="job : ${jobs}">
                    <div class="job-header">
                        <div class="job-title">
                            <h3 th:text="${job.name}"></h3>
                            <div class="description" th:text="${job.description}"></div>
                        </div>
                        <span class="job-status"
                              th:classappend="${job.status == 'ACTIVE' ? 'active' : (job.status == 'PAUSED' ? 'paused' : 'disabled')}"
                              th:text="${job.status}"></span>
                    </div>
                    <div class="job-info">
                        <div class="info-item cron">
                            <label>실행 주기</label>
                            <div class="value" th:attr="title=${job.cronExpression}" th:text="${job.cronDescription != null and !job.cronDescription.isEmpty() ? job.cronDescription : job.cronExpression}"></div>
                        </div>
                        <div class="info-item">
                            <label>시간대</label>
                            <div class="value" th:text="${job.timeZone}"></div>
                        </div>
                        <div class="info-item" th:if="${job.nextExecutionTime}">
                            <label>다음 실행 시간</label>
                            <div class="value" th:text="${#temporals.format(job.nextExecutionTime, 'yyyy-MM-dd HH:mm')}"></div>
                        </div>
                        <div class="info-item" th:if="${job.lastExecutionTime}">
                            <label>마지막 실행 시간</label>
                            <div class="value" th:text="${#temporals.format(job.lastExecutionTime, 'yyyy-MM-dd HH:mm')}"></div>
                        </div>
                    </div>
                    <div class="stats">
                        <div class="stat-item">
                            <label>총 실행 횟수</label>
                            <div class="value" th:text="${job.executionCount != null ? job.executionCount : 0}"></div>
                        </div>
                        <div class="stat-item">
                            <label>성공 횟수</label>
                            <div class="value" style="color: #27ae60;" th:text="${job.successCount != null ? job.successCount : 0}"></div>
                        </div>
                        <div class="stat-item">
                            <label>실패 횟수</label>
                            <div class="value" style="color: #e74c3c;" th:text="${job.failureCount != null ? job.failureCount : 0}"></div>
                        </div>
                    </div>
                    <div class="job-actions" th:if="${job.triggerPath}">
                        <button type="button" class="btn btn-secondary trigger-run-btn" th:attr="data-trigger-path=${job.triggerPath}" th:data-job-id="${job.id}">지금 실행</button>
                        <span class="trigger-message" th:attr="data-job-id=${job.id}" aria-live="polite" style="margin-left: 8px; font-size: 0.9em;"></span>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${jobs == null or jobs.isEmpty()}" class="empty-state">
            <h2>등록된 스케줄 작업이 없습니다.</h2>
        </div>
    </main>
    <script th:inline="javascript">
        (function() {
            document.querySelectorAll('.trigger-run-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var path = this.getAttribute('data-trigger-path');
                    var jobId = this.getAttribute('data-job-id');
                    if (!path) return;
                    var msgEl = document.querySelector('.trigger-message[data-job-id="' + jobId + '"]');
                    if (msgEl) msgEl.textContent = '실행 중...';
                    this.disabled = true;
                    var url = path;
                    if ((path.indexOf('pipeline-execution') !== -1 || path.indexOf('robo-rebalance') !== -1) && path.indexOf('dryRun') === -1) {
                        url = path + (path.indexOf('?') !== -1 ? '&' : '?') + 'dryRun=true';
                    }
                    fetch(url, { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' } })
                        .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
                        .then(function(result) {
                            if (msgEl) msgEl.textContent = result.data && result.data.message ? result.data.message : (result.ok ? '완료' : '실패');
                            if (!result.ok && result.data && result.data.message) msgEl.style.color = '#e74c3c';
                        })
                        .catch(function(err) {
                            if (msgEl) { msgEl.textContent = err.message || '요청 실패'; msgEl.style.color = '#e74c3c'; }
                        })
                        .finally(function() { btn.disabled = false; });
                });
            });
        })();
    </script>
</body>
</html>
