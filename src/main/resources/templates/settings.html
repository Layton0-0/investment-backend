<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설정 - Investment Choi</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body class="page-background">
    <div th:replace="~{fragments/layout-header :: header}"></div>
    <nav th:replace="~{fragments/layout-menu :: menu}"></nav>

    <main class="settings-container" th:attr="data-initial-server-type=${currentServerType}">
        <p class="security-note">아래 탭에서 모의계좌·실계좌를 선택한 뒤, 해당 계좌의 API 연결과 자동투자 설정을 할 수 있습니다.</p>

        <!-- 설정 내부: 모의계좌 | 실계좌 탭 -->
        <div id="settingsTabWrap" class="settings-tab-wrap">
            <div class="segment-control" role="tablist">
                <button type="button" class="segment-btn segment-btn-main active" role="tab" data-settings-tab="virtual" aria-selected="true">모의계좌</button>
                <button type="button" class="segment-btn segment-btn-main" role="tab" data-settings-tab="real" aria-selected="false">실계좌</button>
            </div>
        </div>

        <!-- 모의계좌 패널: 계좌·API 연결 + 자동투자 설정 -->
        <div id="settingsPanelVirtual" class="settings-panel active">
            <div class="card" id="accountsCardVirtual">
                <h2>계좌·API 연결</h2>
                <form id="accountsFormVirtual">
                    <div class="form-group">
                        <label for="currentPasswordVirtual">현재 비밀번호 (API 키 변경 시에만)</label>
                        <input type="password" id="currentPasswordVirtual" autocomplete="current-password" placeholder="API 키 변경 시에만 입력">
                    </div>
                    <div class="account-form-header account-form-header--virtual"><span class="account-form-header-badge">모의계좌</span> API 키·계좌번호</div>
                    <div class="account-block">
                        <div class="form-group">
                            <label for="virtualAppKey">API Key</label>
                            <input type="password" id="virtualAppKey" autocomplete="off" placeholder="등록된 경우 마스킹 표시 (변경 시에만 입력)">
                        </div>
                        <div class="form-group">
                            <label for="virtualAppSecret">API Secret</label>
                            <input type="password" id="virtualAppSecret" autocomplete="off" placeholder="등록된 경우 마스킹 표시 (변경 시에만 입력)">
                        </div>
                        <div class="form-group">
                            <label for="virtualAccountNo">계좌번호</label>
                            <input type="password" id="virtualAccountNo" autocomplete="off" placeholder="형식: 12345678-12 (변경 시에만 입력)">
                        </div>
                    </div>
                    <div class="error-message" id="accountsErrorVirtual"></div>
                    <div class="success-message" id="accountsSuccessVirtual"></div>
                    <button type="button" id="accountsSaveBtnVirtual" class="primary">모의계좌 저장</button>
                </form>
            </div>

            <div class="card">
                <h2>자동투자 설정</h2>
                <div id="tradingFormPanelVirtual" class="trading-form-panel"></div>
                <div id="tradingLoadingVirtual" class="empty-state" style="display: none;"><p class="empty-state-desc">설정을 불러오는 중...</p></div>
            </div>
        </div>

        <!-- 실계좌 패널: 계좌·API 연결 + 자동투자 설정 -->
        <div id="settingsPanelReal" class="settings-panel">
            <div class="card" id="accountsCardReal">
                <h2>계좌·API 연결</h2>
                <form id="accountsFormReal">
                    <div class="form-group">
                        <label for="currentPasswordReal">현재 비밀번호 (API 키 변경 시에만)</label>
                        <input type="password" id="currentPasswordReal" autocomplete="current-password" placeholder="API 키 변경 시에만 입력">
                    </div>
                    <div class="account-form-header account-form-header--real"><span class="account-form-header-badge">실계좌</span> API 키·계좌번호</div>
                    <div class="account-block">
                        <div class="form-group">
                            <label for="realAppKey">API Key</label>
                            <input type="password" id="realAppKey" autocomplete="off" placeholder="등록된 경우 마스킹 표시 (변경 시에만 입력)">
                        </div>
                        <div class="form-group">
                            <label for="realAppSecret">API Secret</label>
                            <input type="password" id="realAppSecret" autocomplete="off" placeholder="등록된 경우 마스킹 표시 (변경 시에만 입력)">
                        </div>
                        <div class="form-group">
                            <label for="realAccountNo">계좌번호</label>
                            <input type="password" id="realAccountNo" autocomplete="off" placeholder="형식: 12345678-12 (변경 시에만 입력)">
                        </div>
                    </div>
                    <div class="error-message" id="accountsErrorReal"></div>
                    <div class="success-message" id="accountsSuccessReal"></div>
                    <button type="button" id="accountsSaveBtnReal" class="primary">실계좌 저장</button>
                </form>
            </div>

            <div class="card">
                <h2>자동투자 설정</h2>
                <div id="tradingFormPanelReal" class="trading-form-panel"></div>
                <div id="tradingLoadingReal" class="empty-state" style="display: none;"><p class="empty-state-desc">설정을 불러오는 중...</p></div>
            </div>
        </div>
    </main>

    <script th:src="@{/js/validation.js}"></script>
    <script>
        (function() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/login';
                return;
            }

            const headers = function() { return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }; };

            function safeId(s) {
                return (s || '').replace(/[^a-zA-Z0-9]/g, '_');
            }

            async function loadSettingsAccounts() {
                try {
                    const res = await fetch('/api/v1/settings/accounts', { headers: headers() });
                    if (res.status === 401) { localStorage.removeItem('token'); window.location.href = '/login'; return; }
                    if (!res.ok) return;
                    const data = await res.json();
                    setBlockPlaceholders('virtual', data.virtual);
                    setBlockPlaceholders('real', data.real);
                } catch (e) { console.error('계좌 설정 로드 실패:', e); }
            }

            function setBlockPlaceholders(prefix, block) {
                if (!block) return;
                var keyEl = document.getElementById(prefix + 'AppKey');
                var secretEl = document.getElementById(prefix + 'AppSecret');
                var accEl = document.getElementById(prefix + 'AccountNo');
                if (keyEl && block.appKeyMasked) keyEl.placeholder = block.appKeyMasked + ' (변경 시에만 입력)';
                if (secretEl && block.appSecretMasked) secretEl.placeholder = block.appSecretMasked + ' (변경 시에만 입력)';
                if (accEl && block.accountNoMasked) accEl.placeholder = block.accountNoMasked + ' (변경 시에만 입력)';
            }

            function showTradingLoading(serverType, show) {
                var loadingId = serverType === '1' ? 'tradingLoadingVirtual' : 'tradingLoadingReal';
                var panelId = serverType === '1' ? 'tradingFormPanelVirtual' : 'tradingFormPanelReal';
                document.getElementById(loadingId).style.display = show ? 'block' : 'none';
                document.getElementById(panelId).classList.toggle('loading', show);
            }

            function buildToggleHtml(fieldName, labelLeft, labelRight, accountNo, checked) {
                var id = fieldName + '-' + safeId(accountNo);
                var title = fieldName === 'autoTradingEnabled' ? '자동투자' : '로보 어드바이저';
                var desc = fieldName === 'autoTradingEnabled'
                    ? '시그널 기반 4단계 파이프라인(유니버스→시그널→자금관리→매매)이 실행됩니다. 로보 어드바이저를 쓰려면 아래 로보 어드바이저도 ON으로 두세요.'
                    : '자동투자 ON인 상태에서 동적 자산배분 리밸런싱(월 1회 등)이 추가로 실행됩니다. 로보 어드바이저로 자동투자하려면 위 자동투자와 여기 로보 어드바이저 둘 다 ON으로 두세요. (로보를 켜면 자동투자도 함께 켜집니다.)';
                return '<div class="form-group" data-toggle-group="' + fieldName + '">' +
                    '<label>' + title + '</label>' +
                    '<p class="info-text">' + desc + '</p>' +
                    '<div class="toggle-switch">' +
                    '<input type="checkbox" id="' + id + '" data-account-no="' + accountNo.replace(/"/g, '&quot;') + '" data-field="' + fieldName + '" ' + (checked ? 'checked' : '') + '>' +
                    '<label for="' + id + '" class="toggle-label">' +
                    '<span class="toggle-text-left">' + labelLeft + '</span>' +
                    '<span class="toggle-slider"></span>' +
                    '<span class="toggle-text-right">' + labelRight + '</span>' +
                    '</label></div></div>';
            }

            function renderTradingForm(accountNo, label, setting, serverType) {
                var shortR = (setting && setting.shortTermRatio != null) ? setting.shortTermRatio : '';
                var midR = (setting && setting.mediumTermRatio != null) ? setting.mediumTermRatio : '';
                var longR = (setting && setting.longTermRatio != null) ? setting.longTermRatio : '';
                var maxAmt = (setting && setting.maxInvestmentAmount != null) ? setting.maxInvestmentAmount : '';
                var minAmt = (setting && setting.minInvestmentAmount != null) ? setting.minInvestmentAmount : '';
                var autoOn = setting && setting.autoTradingEnabled;
                var roboOn = setting && setting.roboAdvisorEnabled;
                var headerClass = serverType === '1' ? 'trading-form-header trading-form-header--virtual' : 'trading-form-header trading-form-header--real';

                return '<div class="trading-form-inner" data-account-no="' + accountNo.replace(/"/g, '&quot;') + '" data-server-type="' + (serverType || '') + '">' +
                    '<div class="' + headerClass + '"><span class="trading-form-header-badge">' + label + '</span> 거래 설정</div>' +
                    '<div class="form-group"><label for="maxAmt-' + safeId(accountNo) + '">최대 투자금액</label>' +
                    '<input type="number" id="maxAmt-' + safeId(accountNo) + '" min="0" step="1" data-field="maxInvestmentAmount" value="' + maxAmt + '"></div>' +
                    '<div class="form-group"><label for="minAmt-' + safeId(accountNo) + '">최소 투자금액</label>' +
                    '<input type="number" id="minAmt-' + safeId(accountNo) + '" min="0" step="1" data-field="minInvestmentAmount" value="' + minAmt + '"></div>' +
                    '<div class="form-group"><label>단기 비율 (0~1, 합=1)</label>' +
                    '<input type="number" min="0" max="1" step="0.01" data-field="shortTermRatio" placeholder="0.2" value="' + shortR + '"></div>' +
                    '<div class="form-group"><label>중기 비율</label>' +
                    '<input type="number" min="0" max="1" step="0.01" data-field="mediumTermRatio" placeholder="0.4" value="' + midR + '"></div>' +
                    '<div class="form-group"><label>장기 비율</label>' +
                    '<input type="number" min="0" max="1" step="0.01" data-field="longTermRatio" placeholder="0.4" value="' + longR + '"></div>' +
                    buildToggleHtml('autoTradingEnabled', 'OFF', 'ON', accountNo, autoOn) +
                    buildToggleHtml('roboAdvisorEnabled', 'OFF', 'ON', accountNo, roboOn) +
                    '<div class="trading-success" id="tradingSuccessMsg"></div>' +
                    '<button type="button" class="primary save-trading-btn" data-account-no="' + accountNo.replace(/"/g, '&quot;') + '">' + label + ' 거래 설정 저장</button>' +
                    '</div>';
            }

            async function loadTradingFormForType(serverType) {
                var panelId = serverType === '1' ? 'tradingFormPanelVirtual' : 'tradingFormPanelReal';
                var panel = document.getElementById(panelId);
                var label = serverType === '1' ? '모의계좌' : '실계좌';
                var emptyMsg = '<div class="empty-state"><p class="empty-state-title">' + label + '가 등록되지 않았어요</p><p class="empty-state-desc">위 \'계좌·API 연결\'에서 ' + label + '를 등록한 뒤, 여기서 자동투자 설정을 할 수 있어요.</p><a href="#accountsCard' + (serverType === '1' ? 'Virtual' : 'Real') + '" class="btn-secondary empty-state-cta">계좌 설정으로 가기</a></div>';

                showTradingLoading(serverType, true);
                panel.innerHTML = '';

                try {
                    var res = await fetch('/api/v1/user/accounts/main?serverType=' + serverType, { headers: headers() });
                    if (!res.ok) {
                        panel.innerHTML = emptyMsg;
                        showTradingLoading(serverType, false);
                        return;
                    }
                    var main = await res.json();
                    if (!main || !main.accountNo) {
                        panel.innerHTML = emptyMsg;
                        showTradingLoading(serverType, false);
                        return;
                    }
                    var accountNo = main.accountNo;

                    var setRes = await fetch('/api/v1/settings/' + encodeURIComponent(accountNo), { headers: headers() });
                    var setting = null;
                    if (setRes.ok) setting = await setRes.json();

                    panel.innerHTML = renderTradingForm(accountNo, label, setting, serverType);
                    var saveBtn = panel.querySelector('.save-trading-btn');
                    if (saveBtn) {
                        saveBtn.addEventListener('click', function() { saveTradingSetting(panel); });
                    }
                    var autoEl = panel.querySelector('input[data-field="autoTradingEnabled"]');
                    var roboEl = panel.querySelector('input[data-field="roboAdvisorEnabled"]');
                    if (roboEl) roboEl.addEventListener('change', function() { if (roboEl.checked && autoEl) autoEl.checked = true; });
                    if (autoEl) autoEl.addEventListener('change', function() { if (!autoEl.checked && roboEl) roboEl.checked = false; });
                } catch (e) {
                    panel.innerHTML = '<div class="empty-state"><p class="empty-state-desc">설정을 불러오는데 실패했어요. 잠시 후 다시 시도해주세요.</p></div>';
                }
                showTradingLoading(serverType, false);
            }

            function saveTradingSetting(panelEl) {
                var inner = panelEl && panelEl.querySelector('.trading-form-inner');
                if (!inner) return;
                var accountNo = inner.getAttribute('data-account-no');
                var maxEl = inner.querySelector('input[data-field="maxInvestmentAmount"]');
                var minEl = inner.querySelector('input[data-field="minInvestmentAmount"]');
                var shortEl = inner.querySelector('input[data-field="shortTermRatio"]');
                var midEl = inner.querySelector('input[data-field="mediumTermRatio"]');
                var longEl = inner.querySelector('input[data-field="longTermRatio"]');
                var autoEl = inner.querySelector('input[data-field="autoTradingEnabled"]');
                var roboEl = inner.querySelector('input[data-field="roboAdvisorEnabled"]');
                var shortR = shortEl && shortEl.value ? parseFloat(shortEl.value) : null;
                var midR = midEl && midEl.value ? parseFloat(midEl.value) : null;
                var longR = longEl && longEl.value ? parseFloat(longEl.value) : null;
                var body = {
                    maxInvestmentAmount: maxEl && maxEl.value ? parseFloat(maxEl.value) : null,
                    minInvestmentAmount: minEl && minEl.value ? parseFloat(minEl.value) : null,
                    defaultCurrency: 'KRW',
                    autoTradingEnabled: autoEl ? autoEl.checked : false,
                    roboAdvisorEnabled: roboEl ? roboEl.checked : false,
                    shortTermRatio: shortR,
                    mediumTermRatio: midR,
                    longTermRatio: longR
                };
                if (!body.maxInvestmentAmount || !body.minInvestmentAmount) {
                    alert('최대/최소 투자금액을 입력하세요.');
                    return;
                }
                if (shortR != null || midR != null || longR != null) {
                    var s = shortR != null ? shortR : 0, m = midR != null ? midR : 0, l = longR != null ? longR : 0;
                    if (Math.abs(s + m + l - 1) > 0.001) {
                        alert('단기·중기·장기 비율의 합은 1이어야 합니다.');
                        return;
                    }
                }
                var saveBtn = inner.querySelector('.save-trading-btn');
                if (saveBtn) saveBtn.disabled = true;
                var successMsg = inner.querySelector('.trading-success');
                if (successMsg) { successMsg.textContent = ''; successMsg.classList.remove('show'); }

                fetch('/api/v1/settings/' + encodeURIComponent(accountNo), { method: 'PUT', headers: headers(), body: JSON.stringify(body) })
                    .then(function(res) {
                        if (saveBtn) saveBtn.disabled = false;
                        if (res.ok) {
                            if (successMsg) { successMsg.textContent = '저장되었습니다.'; successMsg.classList.add('show'); }
                            setTimeout(function() { if (successMsg) successMsg.classList.remove('show'); }, 2500);
                        } else {
                            res.json().then(function(d) { alert(d.message || '저장에 실패했어요.'); }).catch(function() { alert('저장에 실패했어요.'); });
                        }
                    })
                    .catch(function() {
                        if (saveBtn) saveBtn.disabled = false;
                        alert('네트워크 오류가 발생했어요.');
                    });
            }

            function saveAccountsBlock(block) {
                var isVirtual = block === 'virtual';
                var body = {
                    currentPassword: document.getElementById(isVirtual ? 'currentPasswordVirtual' : 'currentPasswordReal').value || null,
                    virtual: null,
                    real: null
                };
                var errId = isVirtual ? 'accountsErrorVirtual' : 'accountsErrorReal';
                var successId = isVirtual ? 'accountsSuccessVirtual' : 'accountsSuccessReal';
                var btnId = isVirtual ? 'accountsSaveBtnVirtual' : 'accountsSaveBtnReal';
                var errEl = document.getElementById(errId);
                var successEl = document.getElementById(successId);
                var btn = document.getElementById(btnId);
                errEl.textContent = '';
                errEl.classList.remove('show');
                successEl.textContent = '';
                successEl.classList.remove('show');

                if (isVirtual) {
                    body.virtual = {
                        appKey: document.getElementById('virtualAppKey').value.trim() || null,
                        appSecret: document.getElementById('virtualAppSecret').value.trim() || null,
                        accountNo: document.getElementById('virtualAccountNo').value.trim() || null
                    };
                } else {
                    body.real = {
                        appKey: document.getElementById('realAppKey').value.trim() || null,
                        appSecret: document.getElementById('realAppSecret').value.trim() || null,
                        accountNo: document.getElementById('realAccountNo').value.trim() || null
                    };
                }

                btn.disabled = true;
                fetch('/api/v1/settings/accounts', { method: 'PUT', headers: headers(), body: JSON.stringify(body) })
                    .then(function(res) { return res.json().catch(function() { return {}; }).then(function(data) {
                        if (res.ok) {
                            successEl.textContent = '저장되었습니다.';
                            successEl.classList.add('show');
                            loadSettingsAccounts();
                            loadTradingFormForType(isVirtual ? '1' : '0');
                            document.getElementById(isVirtual ? 'currentPasswordVirtual' : 'currentPasswordReal').value = '';
                            if (isVirtual) {
                                document.getElementById('virtualAppKey').value = '';
                                document.getElementById('virtualAppSecret').value = '';
                                document.getElementById('virtualAccountNo').value = '';
                            } else {
                                document.getElementById('realAppKey').value = '';
                                document.getElementById('realAppSecret').value = '';
                                document.getElementById('realAccountNo').value = '';
                            }
                        } else {
                            errEl.textContent = data.message || '저장에 실패했습니다.';
                            errEl.classList.add('show');
                        }
                    }); })
                    .catch(function() {
                        errEl.textContent = '네트워크 오류가 발생했습니다.';
                        errEl.classList.add('show');
                    })
                    .finally(function() { btn.disabled = false; });
            }

            document.getElementById('accountsSaveBtnVirtual').addEventListener('click', function(e) { e.preventDefault(); saveAccountsBlock('virtual'); });
            document.getElementById('accountsSaveBtnReal').addEventListener('click', function(e) { e.preventDefault(); saveAccountsBlock('real'); });

            // 설정 내부 탭 전환 (모의계좌 | 실계좌)
            var tabWrap = document.getElementById('settingsTabWrap');
            if (tabWrap) {
                tabWrap.querySelectorAll('.segment-btn-main').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        tabWrap.querySelectorAll('.segment-btn-main').forEach(function(b) {
                            b.classList.remove('active');
                            b.setAttribute('aria-selected', 'false');
                        });
                        btn.classList.add('active');
                        btn.setAttribute('aria-selected', 'true');
                        var tab = btn.getAttribute('data-settings-tab');
                        document.getElementById('settingsPanelVirtual').classList.toggle('active', tab === 'virtual');
                        document.getElementById('settingsPanelReal').classList.toggle('active', tab === 'real');
                        if (tab === 'real') loadTradingFormForType('0');
                        else loadTradingFormForType('1');
                    });
                });
            }

            // 빈 상태 CTA 클릭 시 해당 계좌 API 카드로 스크롤
            document.querySelector('.settings-container').addEventListener('click', function(e) {
                var link = e.target && e.target.closest ? e.target.closest('a.empty-state-cta') : null;
                if (link && link.getAttribute('href') && link.getAttribute('href').indexOf('#accountsCard') === 0) {
                    e.preventDefault();
                    var id = link.getAttribute('href').replace('#', '');
                    var target = document.getElementById(id);
                    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });

            loadSettingsAccounts();
            var initialSt = document.querySelector('.settings-container') && document.querySelector('.settings-container').getAttribute('data-initial-server-type');
            if (initialSt === '0') {
                if (tabWrap) {
                    tabWrap.querySelectorAll('.segment-btn-main').forEach(function(b) {
                        b.classList.remove('active');
                        b.setAttribute('aria-selected', 'false');
                        if (b.getAttribute('data-settings-tab') === 'real') {
                            b.classList.add('active');
                            b.setAttribute('aria-selected', 'true');
                        }
                    });
                }
                document.getElementById('settingsPanelVirtual').classList.remove('active');
                document.getElementById('settingsPanelReal').classList.add('active');
                loadTradingFormForType('0');
            } else {
                document.getElementById('settingsPanelVirtual').classList.add('active');
                document.getElementById('settingsPanelReal').classList.remove('active');
                loadTradingFormForType('1');
            }
        })();
    </script>
</body>
</html>
