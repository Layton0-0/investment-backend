<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴스·이벤트 - Investment Choi</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .page-title { font-size: 22px; font-weight: 700; margin-bottom: 24px; color: #191F28; }
        .filters { background: #fff; padding: 16px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
        .filters input, .filters select { padding: 8px 12px; border: 1px solid #E5E8EB; border-radius: 8px; }
        .card { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #E5E8EB; }
        th { background: #f8f9fa; font-weight: 600; color: #8B95A1; }
        .empty-state { text-align: center; padding: 48px; color: #8B95A1; }
        .pagination { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .pagination a, .pagination span { padding: 6px 12px; border-radius: 8px; text-decoration: none; color: #333; border: 1px solid #E5E8EB; font-size: 14px; }
        .pagination a:hover { background: #f0f4f8; }
        .pagination .current { background: #191F28; color: #fff; border-color: #191F28; }
        .pagination .disabled { color: #8B95A1; pointer-events: none; }
        .pagination-ellipsis { padding: 6px 4px; color: #8B95A1; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/layout-header :: header}"></div>
    <nav th:replace="~{fragments/layout-menu :: menu}"></nav>

    <div class="container">
        <h2 class="page-title">뉴스·이벤트</h2>

        <div class="filters">
            <form method="get" th:action="@{/news}" class="filter-form" style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
                <input type="hidden" name="page" value="0">
                <input type="hidden" name="size" th:value="${size != null ? size : 20}">
                <select name="market">
                    <option value="">전체 시장</option>
                    <option value="KR" th:selected="${market == 'KR'}">국내(KR)</option>
                    <option value="US" th:selected="${market == 'US'}">미국(US)</option>
                </select>
                <select name="source">
                    <option value="">전체 원천</option>
                    <option value="DART" th:selected="${source == 'DART'}">DART(전자공시)</option>
                    <option value="SEC_EDGAR" th:selected="${source == 'SEC_EDGAR'}">SEC EDGAR</option>
                    <option value="YONHAP" th:selected="${source == 'YONHAP'}">연합뉴스(Yonhap)</option>
                </select>
                <select name="itemType">
                    <option value="">전체 유형</option>
                    <option value="FACT" th:selected="${itemType == 'FACT'}">FACT(공시/데이터)</option>
                    <option value="SPEED" th:selected="${itemType == 'SPEED'}">SPEED(뉴스/속보)</option>
                    <option value="BUZZ" th:selected="${itemType == 'BUZZ'}">BUZZ(센티멘트/수급)</option>
                </select>
                <input type="text" name="title" th:value="${title}" placeholder="제목 (부분 일치, 비우면 전체)">
                <input type="text" name="symbol" th:value="${symbol}" placeholder="종목 코드 (비우면 전체)">
                <input type="date" name="from" th:value="${from}">
                <input type="date" name="to" th:value="${to}">
                <button type="submit">조회</button>
                <button type="button" id="triggerCollectBtn" class="primary">뉴스·공시 수집 실행</button>
            </form>
            <div id="collectResult" class="collect-result" style="display: none; margin-top: 8px; padding: 8px; border-radius: 8px; font-size: 14px;"></div>
        </div>

        <div class="card">
            <table th:if="${newsPage != null and newsPage.content != null and !newsPage.content.isEmpty()}">
                <thead>
                    <tr>
                        <th>수집 시각</th>
                        <th>원천</th>
                        <th>시장</th>
                        <th>유형</th>
                        <th>제목</th>
                        <th>종목</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${newsPage.content}">
                        <td th:text="${#temporals.format(item.collectedAt, 'yyyy-MM-dd HH:mm')}"></td>
                        <td th:text="${item.source}"></td>
                        <td th:text="${item.market}"></td>
                        <td th:text="${item.itemType}"></td>
                        <td><a th:href="${item.url}" th:text="${item.title}" target="_blank" rel="noopener"></a></td>
                        <td th:text="${item.symbol}"></td>
                    </tr>
                </tbody>
            </table>
            <div th:if="${newsPage == null or newsPage.content == null or newsPage.content.isEmpty()}" class="empty-state">
                뉴스·공시 항목이 없습니다. 수집 파이프라인 연동 후 목록이 표시됩니다.
            </div>
            <div th:if="${newsPage != null and newsPage.page != null and newsPage.page.totalPages >= 1}" class="pagination"
                 th:with="cur=${newsPage.page.number}, totalP=${newsPage.page.totalPages}, totalE=${newsPage.page.totalElements},
                           startP=${T(java.lang.Math).max(0, cur - 2)}, endP=${T(java.lang.Math).min(totalP - 1, cur + 2)}">
                <span class="pagination-total" th:text="${'총 ' + totalE + '건'}"></span>
                <th:block th:if="${totalP > 1}">
                    <a th:if="${cur > 0}" th:href="@{/news(market=${market}, source=${source}, itemType=${itemType}, symbol=${symbol}, title=${title}, from=${from}, to=${to}, page=${cur - 1}, size=${size})}" rel="prev">이전</a>
                    <span th:if="${cur <= 0}" class="disabled">이전</span>
                    <th:block th:if="${startP > 0}">
                        <a th:href="@{/news(market=${market}, source=${source}, itemType=${itemType}, symbol=${symbol}, title=${title}, from=${from}, to=${to}, page=0, size=${size})}" th:text="1"></a>
                        <span th:if="${startP > 1}" class="pagination-ellipsis">…</span>
                    </th:block>
                    <th:block th:each="p : ${#numbers.sequence(startP, endP)}" th:with="oneBased=${p + 1}">
                        <a th:if="${p != cur}" th:href="@{/news(market=${market}, source=${source}, itemType=${itemType}, symbol=${symbol}, title=${title}, from=${from}, to=${to}, page=${p}, size=${size})}" th:text="${oneBased}"></a>
                        <span th:if="${p == cur}" class="current" th:text="${oneBased}"></span>
                    </th:block>
                    <th:block th:if="${endP < totalP - 1}">
                        <span th:if="${endP < totalP - 2}" class="pagination-ellipsis">…</span>
                        <a th:href="@{/news(market=${market}, source=${source}, itemType=${itemType}, symbol=${symbol}, title=${title}, from=${from}, to=${to}, page=${totalP - 1}, size=${size})}" th:text="${totalP}"></a>
                    </th:block>
                    <a th:if="${cur < totalP - 1}" th:href="@{/news(market=${market}, source=${source}, itemType=${itemType}, symbol=${symbol}, title=${title}, from=${from}, to=${to}, page=${cur + 1}, size=${size})}" rel="next">다음</a>
                    <span th:if="${cur >= totalP - 1}" class="disabled">다음</span>
                </th:block>
            </div>
        </div>
    </div>
    <script>
        (function() {
            var btn = document.getElementById('triggerCollectBtn');
            var resultEl = document.getElementById('collectResult');
            if (btn && resultEl) {
                btn.addEventListener('click', function() {
                    btn.disabled = true;
                    resultEl.style.display = 'block';
                    resultEl.textContent = '수집 중...';
                    resultEl.style.background = '#f0f4f8';
                    resultEl.style.color = '#191F28';
                    fetch('/api/v1/news/collect', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include'
                    })
                    .then(function(res) {
                        if (res.ok) {
                            return res.json();
                        }
                        if (res.status === 401) {
                            resultEl.textContent = '로그인이 필요합니다.';
                            resultEl.style.background = '#fff3cd';
                            return null;
                        }
                        return res.json().then(function(d) { throw new Error(d.error || d.message || '수집 실패'); });
                    })
                    .then(function(data) {
                        if (data) {
                            resultEl.textContent = 'DART ' + data.dartSaved + '건, SEC EDGAR ' + data.secSaved + '건 저장. ' + (data.message || '');
                            resultEl.style.background = '#d4edda';
                            resultEl.style.color = '#155724';
                            setTimeout(function() { window.location.reload(); }, 1500);
                        }
                        btn.disabled = false;
                    })
                    .catch(function(err) {
                        resultEl.textContent = '오류: ' + (err.message || '알 수 없는 오류');
                        resultEl.style.background = '#f8d7da';
                        resultEl.style.color = '#721c24';
                        btn.disabled = false;
                    });
                });
            }
        })();
    </script>
</body>
</html>
