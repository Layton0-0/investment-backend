<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문·체결 - Investment Choi</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .page-title { font-size: 22px; font-weight: 700; margin-bottom: 24px; color: #191F28; }
        .card { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #E5E8EB; }
        th { background: #f8f9fa; font-weight: 600; color: #8B95A1; }
        .empty-state { text-align: center; padding: 48px; color: #8B95A1; }
        .error { background: #fee; color: #c33; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .status-badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-executed { background: #d4edda; color: #155724; }
        .status-failed { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/layout-header :: header}"></div>
    <nav th:replace="~{fragments/layout-menu :: menu}"></nav>

    <div class="container">
        <h2 class="page-title">주문·체결</h2>

        <div th:if="${error}" class="error" th:text="${'오류: ' + error}"></div>

        <div th:if="${hasAccount}">
            <div class="card">
                <table th:if="${orders != null and !orders.isEmpty()}">
                    <thead>
                        <tr>
                            <th>주문일시</th>
                            <th>종목</th>
                            <th>구분</th>
                            <th>수량</th>
                            <th>가격</th>
                            <th>상태</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}">
                            <td th:text="${#temporals.format(order.orderTime, 'yyyy-MM-dd HH:mm')}"></td>
                            <td th:text="${order.symbol}"></td>
                            <td th:text="${order.orderType}"></td>
                            <td th:text="${order.quantity}"></td>
                            <td th:text="${#numbers.formatDecimal(order.price, 2, 'COMMA', 2, 'POINT')}"></td>
                            <td>
                                <span class="status-badge"
                                      th:classappend="${order.status == T(com.investment.order.dto.OrderResponseDto.OrderStatus).PENDING} ? 'status-pending' : (${order.status == T(com.investment.order.dto.OrderResponseDto.OrderStatus).EXECUTED} ? 'status-executed' : 'status-failed')"
                                      th:text="${order.status}"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div th:if="${orders == null or orders.isEmpty()}" class="empty-state">
                    주문 내역이 없습니다.
                </div>
            </div>
        </div>
        <div th:unless="${hasAccount}" class="card">
            <div class="empty-state">계좌를 등록하면 주문·체결 내역을 확인할 수 있습니다. <a th:href="@{/mypage}">설정</a>에서 API 키를 등록하세요.</div>
        </div>
    </div>
</body>
</html>
