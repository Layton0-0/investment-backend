<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${marketLabel != null ? (marketLabel + ' 전략 - Investment Choi') : '투자 전략 관리 - Investment Choi'}">전략 관리</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body class="page-background">
    <div th:replace="~{fragments/layout-header :: header}"></div>
    <nav th:replace="~{fragments/layout-menu :: menu}"></nav>

    <main class="container">
        <p class="info-text" style="margin-bottom: var(--space-lg);">단기/중기/장기 전략 현황 및 제어</p>

        <div th:if="${error}" class="error-box" th:text="${'오류: ' + error}"></div>
        
        <div th:if="${accountNo != null and !accountNo.isEmpty()}">
            <div class="strategies-grid">
                <!-- 단기 전략 -->
                <div class="strategy-card">
                    <h2>
                        <span>⚡ 단기 전략</span>
                        <span class="status-badge" 
                              th:classappend="${shortTerm != null and shortTerm.status == T(com.investment.strategy.domain.StrategyStatus).ACTIVE} ? 'active' : 
                                             (${shortTerm != null and shortTerm.status == T(com.investment.strategy.domain.StrategyStatus).STOPPED} ? 'stopped' : 'paused')"
                              th:text="${shortTerm != null ? shortTerm.status : '미설정'}"></span>
                    </h2>
                    
                    <div th:if="${shortTerm != null}">
                        <div class="strategy-info">
                            <div class="info-item">
                                <label>최대 투자금액</label>
                                <span class="value" th:text="${#numbers.formatDecimal(shortTerm.maxInvestmentAmount, 0, 'COMMA', 0, 'POINT')} + ' USD'"></span>
                            </div>
                            <div class="info-item">
                                <label>최소 투자금액</label>
                                <span class="value" th:text="${#numbers.formatDecimal(shortTerm.minInvestmentAmount, 0, 'COMMA', 0, 'POINT')} + ' USD'"></span>
                            </div>
                            <div class="info-item">
                                <label>리스크 레벨</label>
                                <span class="value" th:text="${shortTerm.riskLevel != null ? #numbers.formatDecimal(shortTerm.riskLevel, 2, 'COMMA', 2, 'POINT') : 'N/A'}"></span>
                            </div>
                            <div class="info-item">
                                <label>신뢰도 임계값</label>
                                <span class="value" th:text="${shortTerm.confidenceThreshold != null ? #numbers.formatDecimal(shortTerm.confidenceThreshold, 2, 'COMMA', 2, 'POINT') : 'N/A'}"></span>
                            </div>
                            <div class="info-item" th:if="${shortTerm.lastExecutedAt != null}">
                                <label>마지막 실행</label>
                                <span class="value" th:text="${#temporals.format(shortTerm.lastExecutedAt, 'yyyy-MM-dd HH:mm')}"></span>
                            </div>
                        </div>
                        
                        <div class="performance-stats">
                            <div class="stat-item">
                                <div class="label">총 실행</div>
                                <div class="value" th:text="${shortTerm.totalExecutions != null ? shortTerm.totalExecutions : 0}"></div>
                            </div>
                            <div class="stat-item">
                                <div class="label">성공률</div>
                                <div class="value" th:classappend="${shortTerm.successRate != null and shortTerm.successRate >= 50} ? 'positive' : 'negative'"
                                     th:text="${shortTerm.successRate != null ? (#numbers.formatDecimal(shortTerm.successRate, 2, 'COMMA', 2, 'POINT') + '%') : 'N/A'}"></div>
                            </div>
                            <div class="stat-item">
                                <div class="label">손익</div>
                                <div class="value" th:classappend="${shortTerm.totalProfitLoss != null and shortTerm.totalProfitLoss >= 0} ? 'positive' : 'negative'"
                                     th:text="${shortTerm.totalProfitLoss != null ? (#numbers.formatDecimal(shortTerm.totalProfitLoss, 0, 'COMMA', 0, 'POINT') + ' USD') : '0 USD'}"></div>
                            </div>
                        </div>
                        
                        <div class="strategy-actions">
                            <form method="post" th:action="@{/strategies/activate}" style="flex: 1;">
                                <input type="hidden" name="accountNo" th:value="${accountNo}">
                                <input type="hidden" name="market" th:value="${market}">
                                <input type="hidden" name="serverType" th:value="${currentServerType}">
                                <input type="hidden" name="market" th:value="${market}">
                                <input type="hidden" name="strategyType" value="SHORT_TERM">
                                <button type="submit" class="btn btn-activate" 
                                        th:disabled="${shortTerm.status == T(com.investment.strategy.domain.StrategyStatus).ACTIVE}">시작</button>
                            </form>
                            <form method="post" th:action="@{/strategies/stop}" style="flex: 1;">
                                <input type="hidden" name="accountNo" th:value="${accountNo}">
                                <input type="hidden" name="market" th:value="${market}">
                                <input type="hidden" name="serverType" th:value="${currentServerType}">
                                <input type="hidden" name="market" th:value="${market}">
                                <input type="hidden" name="strategyType" value="SHORT_TERM">
                                <button type="submit" class="btn btn-stop"
                                        th:disabled="${shortTerm.status == T(com.investment.strategy.domain.StrategyStatus).STOPPED}">중지</button>
                            </form>
                        </div>
                    </div>
                    
                    <div th:if="${shortTerm == null}" class="empty-state">
                        <p>단기 전략이 설정되지 않았습니다.</p>
                    </div>
                </div>
                
                <!-- 중기 전략 -->
                <div class="strategy-card">
                    <h2>
                        <span>📈 중기 전략</span>
                        <span class="status-badge" 
                              th:classappend="${mediumTerm != null and mediumTerm.status == T(com.investment.strategy.domain.StrategyStatus).ACTIVE} ? 'active' : 
                                             (${mediumTerm != null and mediumTerm.status == T(com.investment.strategy.domain.StrategyStatus).STOPPED} ? 'stopped' : 'paused')"
                              th:text="${mediumTerm != null ? mediumTerm.status : '미설정'}"></span>
                    </h2>
                    
                    <div th:if="${mediumTerm != null}">
                        <div class="strategy-info">
                            <div class="info-item">
                                <label>최대 투자금액</label>
                                <span class="value" th:text="${#numbers.formatDecimal(mediumTerm.maxInvestmentAmount, 0, 'COMMA', 0, 'POINT')} + ' USD'"></span>
                            </div>
                            <div class="info-item">
                                <label>최소 투자금액</label>
                                <span class="value" th:text="${#numbers.formatDecimal(mediumTerm.minInvestmentAmount, 0, 'COMMA', 0, 'POINT')} + ' USD'"></span>
                            </div>
                            <div class="info-item">
                                <label>리스크 레벨</label>
                                <span class="value" th:text="${mediumTerm.riskLevel != null ? #numbers.formatDecimal(mediumTerm.riskLevel, 2, 'COMMA', 2, 'POINT') : 'N/A'}"></span>
                            </div>
                            <div class="info-item">
                                <label>신뢰도 임계값</label>
                                <span class="value" th:text="${mediumTerm.confidenceThreshold != null ? #numbers.formatDecimal(mediumTerm.confidenceThreshold, 2, 'COMMA', 2, 'POINT') : 'N/A'}"></span>
                            </div>
                            <div class="info-item" th:if="${mediumTerm.lastExecutedAt != null}">
                                <label>마지막 실행</label>
                                <span class="value" th:text="${#temporals.format(mediumTerm.lastExecutedAt, 'yyyy-MM-dd HH:mm')}"></span>
                            </div>
                        </div>
                        
                        <div class="performance-stats">
                            <div class="stat-item">
                                <div class="label">총 실행</div>
                                <div class="value" th:text="${mediumTerm.totalExecutions != null ? mediumTerm.totalExecutions : 0}"></div>
                            </div>
                            <div class="stat-item">
                                <div class="label">성공률</div>
                                <div class="value" th:classappend="${mediumTerm.successRate != null and mediumTerm.successRate >= 50} ? 'positive' : 'negative'"
                                     th:text="${mediumTerm.successRate != null ? (#numbers.formatDecimal(mediumTerm.successRate, 2, 'COMMA', 2, 'POINT') + '%') : 'N/A'}"></div>
                            </div>
                            <div class="stat-item">
                                <div class="label">손익</div>
                                <div class="value" th:classappend="${mediumTerm.totalProfitLoss != null and mediumTerm.totalProfitLoss >= 0} ? 'positive' : 'negative'"
                                     th:text="${mediumTerm.totalProfitLoss != null ? (#numbers.formatDecimal(mediumTerm.totalProfitLoss, 0, 'COMMA', 0, 'POINT') + ' USD') : '0 USD'}"></div>
                            </div>
                        </div>
                        
                        <div class="strategy-actions">
                            <form method="post" th:action="@{/strategies/activate}" style="flex: 1;">
                                <input type="hidden" name="accountNo" th:value="${accountNo}">
                                <input type="hidden" name="market" th:value="${market}">
                                <input type="hidden" name="serverType" th:value="${currentServerType}">
                                <input type="hidden" name="market" th:value="${market}">
                                <input type="hidden" name="strategyType" value="MEDIUM_TERM">
                                <button type="submit" class="btn btn-activate" 
                                        th:disabled="${mediumTerm.status == T(com.investment.strategy.domain.StrategyStatus).ACTIVE}">시작</button>
                            </form>
                            <form method="post" th:action="@{/strategies/stop}" style="flex: 1;">
                                <input type="hidden" name="accountNo" th:value="${accountNo}">
                                <input type="hidden" name="market" th:value="${market}">
                                <input type="hidden" name="serverType" th:value="${currentServerType}">
                                <input type="hidden" name="market" th:value="${market}">
                                <input type="hidden" name="strategyType" value="MEDIUM_TERM">
                                <button type="submit" class="btn btn-stop"
                                        th:disabled="${mediumTerm.status == T(com.investment.strategy.domain.StrategyStatus).STOPPED}">중지</button>
                            </form>
                        </div>
                    </div>
                    
                    <div th:if="${mediumTerm == null}" class="empty-state">
                        <p>중기 전략이 설정되지 않았습니다.</p>
                    </div>
                </div>
                
                <!-- 장기 전략 -->
                <div class="strategy-card">
                    <h2>
                        <span>🚀 장기 전략</span>
                        <span class="status-badge" 
                              th:classappend="${longTerm != null and longTerm.status == T(com.investment.strategy.domain.StrategyStatus).ACTIVE} ? 'active' : 
                                             (${longTerm != null and longTerm.status == T(com.investment.strategy.domain.StrategyStatus).STOPPED} ? 'stopped' : 'paused')"
                              th:text="${longTerm != null ? longTerm.status : '미설정'}"></span>
                    </h2>
                    
                    <div th:if="${longTerm != null}">
                        <div class="strategy-info">
                            <div class="info-item">
                                <label>최대 투자금액</label>
                                <span class="value" th:text="${#numbers.formatDecimal(longTerm.maxInvestmentAmount, 0, 'COMMA', 0, 'POINT')} + ' USD'"></span>
                            </div>
                            <div class="info-item">
                                <label>최소 투자금액</label>
                                <span class="value" th:text="${#numbers.formatDecimal(longTerm.minInvestmentAmount, 0, 'COMMA', 0, 'POINT')} + ' USD'"></span>
                            </div>
                            <div class="info-item">
                                <label>리스크 레벨</label>
                                <span class="value" th:text="${longTerm.riskLevel != null ? #numbers.formatDecimal(longTerm.riskLevel, 2, 'COMMA', 2, 'POINT') : 'N/A'}"></span>
                            </div>
                            <div class="info-item">
                                <label>신뢰도 임계값</label>
                                <span class="value" th:text="${longTerm.confidenceThreshold != null ? #numbers.formatDecimal(longTerm.confidenceThreshold, 2, 'COMMA', 2, 'POINT') : 'N/A'}"></span>
                            </div>
                            <div class="info-item" th:if="${longTerm.lastExecutedAt != null}">
                                <label>마지막 실행</label>
                                <span class="value" th:text="${#temporals.format(longTerm.lastExecutedAt, 'yyyy-MM-dd HH:mm')}"></span>
                            </div>
                        </div>
                        
                        <div class="performance-stats">
                            <div class="stat-item">
                                <div class="label">총 실행</div>
                                <div class="value" th:text="${longTerm.totalExecutions != null ? longTerm.totalExecutions : 0}"></div>
                            </div>
                            <div class="stat-item">
                                <div class="label">성공률</div>
                                <div class="value" th:classappend="${longTerm.successRate != null and longTerm.successRate >= 50} ? 'positive' : 'negative'"
                                     th:text="${longTerm.successRate != null ? (#numbers.formatDecimal(longTerm.successRate, 2, 'COMMA', 2, 'POINT') + '%') : 'N/A'}"></div>
                            </div>
                            <div class="stat-item">
                                <div class="label">손익</div>
                                <div class="value" th:classappend="${longTerm.totalProfitLoss != null and longTerm.totalProfitLoss >= 0} ? 'positive' : 'negative'"
                                     th:text="${longTerm.totalProfitLoss != null ? (#numbers.formatDecimal(longTerm.totalProfitLoss, 0, 'COMMA', 0, 'POINT') + ' USD') : '0 USD'}"></div>
                            </div>
                        </div>
                        
                        <div class="strategy-actions">
                            <form method="post" th:action="@{/strategies/activate}" style="flex: 1;">
                                <input type="hidden" name="accountNo" th:value="${accountNo}">
                                <input type="hidden" name="market" th:value="${market}">
                                <input type="hidden" name="serverType" th:value="${currentServerType}">
                                <input type="hidden" name="market" th:value="${market}">
                                <input type="hidden" name="strategyType" value="LONG_TERM">
                                <button type="submit" class="btn btn-activate" 
                                        th:disabled="${longTerm.status == T(com.investment.strategy.domain.StrategyStatus).ACTIVE}">시작</button>
                            </form>
                            <form method="post" th:action="@{/strategies/stop}" style="flex: 1;">
                                <input type="hidden" name="accountNo" th:value="${accountNo}">
                                <input type="hidden" name="market" th:value="${market}">
                                <input type="hidden" name="serverType" th:value="${currentServerType}">
                                <input type="hidden" name="market" th:value="${market}">
                                <input type="hidden" name="strategyType" value="LONG_TERM">
                                <button type="submit" class="btn btn-stop"
                                        th:disabled="${longTerm.status == T(com.investment.strategy.domain.StrategyStatus).STOPPED}">중지</button>
                            </form>
                        </div>
                    </div>
                    
                    <div th:if="${longTerm == null}" class="empty-state">
                        <p>장기 전략이 설정되지 않았습니다.</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div th:if="${accountNo == null or accountNo.isEmpty()}">
            <div class="empty-state">
                <h2 th:text="${accountMessage != null ? accountMessage : (market == 'KR' ? '모의계좌를 등록해주세요' : (market == 'US' ? '실계좌를 등록해주세요' : '국내 전략은 모의계좌, 미국 전략은 실계좌를 자동으로 사용합니다. 메뉴에서 국내 전략 또는 미국 전략을 선택하세요.'))}">계좌를 등록해주세요</h2>
                <p th:if="${accountMessage != null}">설정에서 API 키와 계좌를 등록할 수 있습니다.</p>
                <a th:if="${accountMessage != null}" th:href="@{/settings(serverType=${currentServerType})}" class="action-button">설정에서 계좌 등록</a>
            </div>
        </div>
    </main>
</body>
</html>
