<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>트레이딩 포트폴리오 - Investment Choi</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body class="page-background">
    <div th:replace="~{fragments/layout-header :: header}"></div>
    <nav th:replace="~{fragments/layout-menu :: menu}"></nav>

    <main class="container">
        <div class="header">
            <div class="date-selector">
                <input type="date" id="dateInput" th:value="${portfolio?.tradingDate}">
                <button type="button" onclick="loadPortfolio()">조회</button>
                <button type="button" onclick="loadToday()" style="background: #20D26D;">오늘</button>
                <button type="button" onclick="generatePortfolio()" style="background: #f39c12;">수동 생성</button>
            </div>
        </div>
        
        <div th:if="${error}" class="error-box" th:text="${'오류: ' + error}"></div>
        
        <div th:if="${portfolio}">
            <div class="market-summary" th:text="${portfolio.marketSummary}"></div>
            
            <h2>단기 유망 섹터 TOP3</h2>
            <div class="sectors">
                <div class="sector-card">
                    <h3>1위</h3>
                    <p th:text="${portfolio.topSector1}"></p>
                </div>
                <div class="sector-card">
                    <h3>2위</h3>
                    <p th:text="${portfolio.topSector2}"></p>
                </div>
                <div class="sector-card">
                    <h3>3위</h3>
                    <p th:text="${portfolio.topSector3}"></p>
                </div>
            </div>
            
            <h2>단기 매매 후보 종목 TOP5</h2>
            <div class="stocks-grid">
                <div class="stock-card" th:each="item : ${portfolio.items}">
                    <div class="stock-header">
                        <div class="stock-title">
                            <span class="rank" th:text="'#' + ${item.ranking}"></span>
                            <div>
                                <h3 th:text="${item.symbol}"></h3>
                                <span class="name" th:text="${item.name}"></span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="price-info">
                        <div class="price-item entry">
                            <label>진입가 구간</label>
                            <div class="value" th:text="${{item.entryPriceMin}} + ' ~ ' + ${{item.entryPriceMax}}"></div>
                        </div>
                        <div class="price-item stop-loss">
                            <label>손절가</label>
                            <div class="value" th:text="${{item.stopLossPrice}}"></div>
                        </div>
                        <div class="price-item target">
                            <label>목표가 1/2</label>
                            <div class="value" th:text="${{item.targetPrice1}} + ' / ' + ${{item.targetPrice2}}"></div>
                        </div>
                        <div class="price-item profit">
                            <label>예상 수익</label>
                            <div class="value" th:text="${{item.expectedProfit}} + ' (' + ${{item.expectedReturnRate}} + '%)'"></div>
                        </div>
                    </div>
                    
                    <div class="analysis">
                        <div class="analysis-section">
                            <h4>기술적 근거</h4>
                            <p th:text="${item.technicalBasis}"></p>
                        </div>
                        <div class="analysis-section">
                            <h4>수급 근거</h4>
                            <p th:text="${item.supplyDemandBasis}"></p>
                        </div>
                        <div class="analysis-section">
                            <h4>촉매 요인</h4>
                            <p th:text="${item.catalystFactor}"></p>
                        </div>
                    </div>
                    
                    <div class="time-info">
                        <div class="time-item">
                            <label>매수 시간:</label>
                            <span class="value" th:text="${item.buyTime}"></span>
                        </div>
                        <div class="time-item" th:if="${item.sellTime}">
                            <label>매도 시간:</label>
                            <span class="value" th:text="${item.sellTime}"></span>
                        </div>
                        <div class="time-item">
                            <label>투자금액:</label>
                            <span class="value" th:text="${{item.investmentAmount}}"></span>
                        </div>
                        <div class="time-item">
                            <label>R/R 비율:</label>
                            <span class="value" th:text="${{item.riskRewardRatio}}"></span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="risk-management" th:text="${portfolio.riskManagementStrategy}"></div>
        </div>
    </main>

    <script>
        function loadPortfolio() {
            const date = document.getElementById('dateInput').value;
            if (date) {
                window.location.href = '/portfolio?date=' + date;
            } else {
                loadToday();
            }
        }
        
        function loadToday() {
            window.location.href = '/portfolio';
        }
        
        function generatePortfolio() {
            const date = document.getElementById('dateInput').value;
            const targetDate = date || new Date().toISOString().split('T')[0];
            
            if (confirm('포트폴리오를 생성하시겠습니까? (날짜: ' + targetDate + ')')) {
                fetch('/api/v1/trading-portfolios/generate?date=' + targetDate, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                })
                .then(response => {
                    if (response.ok) {
                        alert('포트폴리오가 생성되었습니다.');
                        window.location.reload();
                    } else {
                        response.json().then(data => {
                            alert('포트폴리오 생성 실패: ' + (data.message || '알 수 없는 오류'));
                        });
                    }
                })
                .catch(error => {
                    alert('포트폴리오 생성 중 오류가 발생했습니다: ' + error.message);
                });
            }
        }
    </script>
</body>
</html>
