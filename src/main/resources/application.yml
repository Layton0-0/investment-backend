spring:
  application:
    name: investment-choi
  profiles:
    active: local
  
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/investment?currentSchema=public}
    username: ${SPRING_DATASOURCE_USERNAME:investment}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  batch:
    jdbc:
      initialize-schema: never

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 20

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false
  
  # Redis 설정
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
        # 종료 시 Lettuce 타이머/연결 정리 대기 (기본 100ms → 5s, 메모리 누수 경고 완화)
        shutdown-timeout: 5s
  
  # 캐싱 설정
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10분
      cache-null-values: false

  # 컨텍스트 종료 시 Bean 정리 대기 시간 (Lettuce/Hikari 스레드 정리 완료까지)
  lifecycle:
    timeout-per-shutdown-phase: 35s

server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# CORS: 프론트엔드 Origin 허용. 미설정 시 로컬(localhost, 5173)만 허용.
# 배포만: CORS_ALLOWED_ORIGINS=https://neekly-report.cloud
# 로컬+배포 동시: CORS_ALLOWED_ORIGINS=https://neekly-report.cloud,http://localhost,http://localhost:5173,http://127.0.0.1,http://127.0.0.1:5173
# 참고: docs/07-security/02-security-configuration-reference.md § CORS 설정

logging:
  level:
    root: INFO
    com.investment: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /LOG/investment-choi.log
    max-size: 100MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

investment:
  # 포트폴리오 구성 모드: stub(기본) | inverse-volatility. inverse-volatility 시 역변동성 가중 서비스·실구현 Rebalancer/TaxAwareOptimizer 사용
  portfolio:
    mode: ${INVESTMENT_PORTFOLIO_MODE:stub}
    inverse-volatility:
      max-allocation-pct: ${INVESTMENT_PORTFOLIO_INV_VOL_MAX_PCT:0.2}  # 종목당 최대 할당 비율 (20%)
  # 배치 Job 실패 시 Discord 알림 (webhook 설정 시에만 동작)
  batch:
    failure-alert-enabled: ${BATCH_FAILURE_ALERT_ENABLED:true}
  # 마찰 비용 (한국투자증권 KIS 실전 수수료·세금·슬리피지). 백테스트 PnL 반영용.
  fees:
    korea:
      stock:
        commission: 0.000140527   # 0.0140527% (은행제휴/Ban-joo)
        tax: 0.0018               # 0.18% (증권거래세, 매도 시)
        slippage: 0.001           # 0.1%
      etf:
        commission: 0.000140527
        tax: 0.0                  # 거래세 면제
        slippage: 0.0005
    usa:
      stock:
        commission: 0.0025        # 0.25% (표준)
        sec-fee: 0.0000278       # 매도 시 (SEC Fee)
        taf-per-share-usd: 0.000166  # 매도 시 TAF, 최대 8.30 USD
        slippage: 0.0005
      currency:
        exchange-rate-spread: 0.001  # 0.1% (환전 우대 가정)
  # 데이터 수집 (KRX API 키는 로그 마스킹 대상). DART/SEC는 Python 수집기 환경변수 사용
  data:
    krx:
      auth-key: ${KRX_AUTH_KEY:}
      base-url: ${KRX_BASE_URL:https://data-dbg.krx.co.kr}
      schedule-cron: ${KRX_SCHEDULE_CRON:0 0 16 * * *}
      # KRX 실패 시 한투 API 일봉 보조 소스 (기본 false)
      korea-investment-fallback-enabled: ${KRX_KOREA_INVESTMENT_FALLBACK_ENABLED:true}
      korea-investment-fallback-user-id: ${KRX_KOREA_INVESTMENT_FALLBACK_USER_ID:yoon}
      fallback-symbols-source: ${KRX_FALLBACK_SYMBOLS_SOURCE:PREVIOUS_DAY}
      fallback-symbols: ${KRX_FALLBACK_SYMBOLS:}
    us:
      schedule-cron: ${US_SCHEDULE_CRON:0 0 17 * * *}  # US 시장 일별 시세 수집 (미국 장 마감 후, 기본 17:00 KST)
      # US 일봉 수집: investment-data-collector 서비스 URL (권장). 예: http://localhost:8001
      collector-url: ${US_COLLECTOR_URL:}
      # 로컬 스크립트 경로. collector-url 미설정일 때만 사용. 스크립트는 investment-data-collector 레포에 있음.
      yfinance-script-path: ${US_YFINANCE_SCRIPT_PATH:}
      # 퀀트 유니버스: 지수·섹터 ETF(듀얼모멘텀) + 대표 메가캡. 환경변수 US_SYMBOLS로 덮어쓰기
      symbols: ${US_SYMBOLS:SPY,QQQ,IWM,TLT,IEF,BIL,GLD,DBC,XLK,XLF,XLE,XLV,XLY,XLP,XLB,XLI,XLC,AAPL,MSFT,GOOGL,AMZN,META,TSLA,NVDA,JPM,V,JNJ,WMT,UNH,HD,PG,MA,BAC,XOM,CVX}
      python-command: ${US_PYTHON_COMMAND:python}
      # HTTP 호출 실패 시 재시도 (연결/타임아웃/5xx). 0이면 재시도 없음.
      retry-max: ${US_COLLECTOR_RETRY_MAX:2}
      retry-initial-ms: ${US_COLLECTOR_RETRY_INITIAL_MS:1000}
      # US 일별 수집 실패·0건 시 Discord 알림 (webhook 설정 시에만 동작)
      failure-alert-enabled: ${US_COLLECTOR_FAILURE_ALERT_ENABLED:true}
    # 내부 수집 API (Yahoo·DART·SEC 등 Python 수집기 → Spring 전달 시 사용). 키 미설정 시 내부 API 비활성화.
    internal-api-key: ${DATA_COLLECTION_INTERNAL_KEY:}
  # 뉴스·공시 시그널 연동 (DART 키워드·8-K). 포지션 사이징 시 시그널 공시 종목 우선 정렬
  news:
    signal-lookback-days: ${NEWS_SIGNAL_LOOKBACK_DAYS:7}
    # 시그널 공시 종목 정렬 가중치 (PositionSizingService). 1.0 = 기본
    signal-weight: ${NEWS_SIGNAL_WEIGHT:1.0}
    # 뉴스 센티멘트(키워드 기반)를 시그널 점수에 반영하는 비율. 종목별 평균 센티멘트 * 이 값 가산
    sentiment-weight: ${NEWS_SENTIMENT_WEIGHT:0.1}
  # 팩터 계산 (이격도·변동성 돌파·유동성). 매일 장 시작 전 실행.
  factor:
    schedule-cron: ${FACTOR_SCHEDULE_CRON:0 0 8 * * *}
    disparity-ma-days: ${FACTOR_DISPARITY_MA_DAYS:20}
    volatility-breakout-k: ${FACTOR_VOLATILITY_BREAKOUT_K:0.5}  # 기본 k 계수
    volatility-breakout-k-dynamic: ${FACTOR_VOLATILITY_BREAKOUT_K_DYNAMIC:true}  # 한국장 변동성에 따른 k 동적 조정
    volatility-breakout-k-min: ${FACTOR_VOLATILITY_BREAKOUT_K_MIN:0.3}  # 동적 조정 최소 k
    volatility-breakout-k-max: ${FACTOR_VOLATILITY_BREAKOUT_K_MAX:0.7}  # 동적 조정 최대 k
    liquidity-min-trd-val: ${FACTOR_LIQUIDITY_MIN_TRD_VAL:1000000000}
    # 시초가/변동성 돌파 시 유동성 임계(전일 거래대금, 원). KR 단기 09:00~10:00 시 슬리피지 방어용 (기본 300억)
    liquidity-min-trd-val-opening: ${FACTOR_LIQUIDITY_MIN_TRD_VAL_OPENING:30000000000}
    # Sector RS(한국): 상위 N개 업종만 유니버스 포함. TB_SECTOR_RETURN·TB_SYMBOL_SECTOR 데이터 수집 후 적용
    sector-rs-top-n: ${FACTOR_SECTOR_RS_TOP_N:5}
    # Post-Earnings Drift(미국): 최근 N일 실적 발표 대상, 상위 N% 종목만 유니버스 포함. TB_EARNINGS_SURPRISE 수집 후 적용
    earnings-surprise-lookback-days: ${FACTOR_EARNINGS_SURPRISE_LOOKBACK_DAYS:90}
    earnings-surprise-top-pct: ${FACTOR_EARNINGS_SURPRISE_TOP_PCT:0.2}
    # 미국(US): 갭 상승 N% 이상 시 진입 스킵 (전일 종가 대비, 기본 5%)
    us-gap-up-skip-pct: ${FACTOR_US_GAP_UP_SKIP_PCT:5}
    # 미국 듀얼 모멘텀: 기간(거래일 수) 및 가중치 (최근 1개월 가중치 높게). 쉼표 구분.
    dual-momentum-period-days: ${FACTOR_DUAL_MOMENTUM_PERIOD_DAYS:21,63,126}
    dual-momentum-weights: ${FACTOR_DUAL_MOMENTUM_WEIGHTS:0.5,0.3,0.2}
    # 수급 강도(한국): 순매수/시총 비율 임계값 (0.5% 초과 시 시그널). TB_ORDER_FLOW 수집 후 적용
    smart-money-intensity-threshold-pct: ${FACTOR_SMART_MONEY_INTENSITY_THRESHOLD_PCT:0.005}
    # 한국(KR) 역발상 RSI: RSI(14) < 이 값이면 과매도 매수 시그널 가중 (기본 40)
    contrarian-rsi-threshold: ${FACTOR_CONTRARIAN_RSI_THRESHOLD:40}
    # 한국(KR) 저평가 P/B 구간 (바닥 0.8~0.9). 데이터 소스 확정 후 유니버스/시그널 필터 적용
    pb-value-min: ${FACTOR_PB_VALUE_MIN:0.8}
    pb-value-max: ${FACTOR_PB_VALUE_MAX:0.9}
    position-risk-pct: ${FACTOR_POSITION_RISK_PCT:0.01}  # 1회 매매당 총자산 1% 리스크
    # 초기 운용: 켈리 비활성화 시 고정 비율만 사용 (기본 true=Half-Kelly 사용, false=고정 비율만)
    kelly-enabled: ${FACTOR_KELLY_ENABLED:true}
    # 켈리 비활성 시 1종목당 자산 대비 최대 비율 (%)
    kelly-fixed-allocation-pct: ${FACTOR_KELLY_FIXED_ALLOCATION_PCT:2}
    kelly-p: ${FACTOR_KELLY_P:0.6}  # Half-Kelly 승률 (기본값 60%). 백테스트 winRate 연동 시 전략별로 덮어씀
    kelly-b: ${FACTOR_KELLY_B:2.0}  # Half-Kelly 손익비 (기본값 2:1). 백테스트 profitFactor 연동 시 전략별로 덮어씀
    # 전략별 Half-Kelly p·b (미설정 시 위 kelly-p, kelly-b 사용). 백테스트 결과(winRate, profitFactor) 반영용
    kelly-p-short-term: ${FACTOR_KELLY_P_SHORT_TERM:}
    kelly-b-short-term: ${FACTOR_KELLY_B_SHORT_TERM:}
    kelly-p-medium-term: ${FACTOR_KELLY_P_MEDIUM_TERM:}
    kelly-b-medium-term: ${FACTOR_KELLY_B_MEDIUM_TERM:}
    kelly-p-long-term: ${FACTOR_KELLY_P_LONG_TERM:}
    kelly-b-long-term: ${FACTOR_KELLY_B_LONG_TERM:}
    # 종목당 최대 비중 (%). 0이면 미적용
    position-cap-per-symbol-pct: ${FACTOR_POSITION_CAP_PER_SYMBOL_PCT:10}
    # 일일 최대 신규 매수 종목 수 (0이면 미적용). 파이프라인에서 권장 목록 자르기
    max-new-positions-per-day: ${FACTOR_MAX_NEW_POSITIONS_PER_DAY:10}
    # 리스크 기반 포지션 사이징: 종목당 비중 상한 (기본 비활성). true 시 risk-based-cap-max-pct 적용
    risk-based-cap-enabled: ${FACTOR_RISK_BASED_CAP_ENABLED:true}
    risk-based-cap-max-pct: ${FACTOR_RISK_BASED_CAP_MAX_PCT:0.05}  # 종목당 최대 비중 (5%). 0.05 = 5%
    # 포트폴리오 상관관계 패널티: 고상관 종목 쌍 시 비중 스케일 다운 (기본 비활성)
    correlation-penalty-enabled: ${FACTOR_CORRELATION_PENALTY_ENABLED:true}
    correlation-threshold: ${FACTOR_CORRELATION_THRESHOLD:0.7}      # 상관계수 이 값 이상이면 패널티
    correlation-penalty-scale: ${FACTOR_CORRELATION_PENALTY_SCALE:0.8}  # 적용 시 비중 배율 (0~1)
    # 단일 섹터 비중 상한 (P2-3). 0.30 = 30%, 초과 시 해당 섹터 비중 비례 축소. TB_SYMBOL_SECTOR 활용
    sector-concentration-limit-pct: ${FACTOR_SECTOR_CONCENTRATION_LIMIT_PCT:0.30}
  # 분석 API (상관관계 등)
  analysis:
    correlation-lookback-days: ${INVESTMENT_ANALYSIS_CORRELATION_LOOKBACK_DAYS:60}
  # 리스크 게이트·일일 손실 한도 (전문 투자자 흐름 P0)
  risk:
    regime-gate-enabled: ${INVESTMENT_RISK_REGIME_GATE_ENABLED:true}
    regime-detection-enabled: ${INVESTMENT_RISK_REGIME_DETECTION_ENABLED:true}
    vix-threshold: ${INVESTMENT_RISK_VIX_THRESHOLD:30}
    reduce-size-on-high-vol-pct: ${INVESTMENT_RISK_REDUCE_SIZE_ON_HIGH_VOL_PCT:50}
    daily-loss-limit-pct: ${INVESTMENT_RISK_DAILY_LOSS_LIMIT_PCT:5}
    # 시장 급락 게이트: 벤치마크 일일 낙폭이 이 값 이상이면 당일 신규 매수 중단 (기본 5 = -5%)
    market-crash-gate-enabled: ${INVESTMENT_RISK_MARKET_CRASH_GATE_ENABLED:true}
    market-crash-daily-drop-pct: ${INVESTMENT_RISK_MARKET_CRASH_DAILY_DROP_PCT:5}
    market-crash-benchmark-symbol: ${INVESTMENT_RISK_MARKET_CRASH_BENCHMARK_SYMBOL:SPY}
    market-crash-benchmark-market: ${INVESTMENT_RISK_MARKET_CRASH_BENCHMARK_MARKET:US}
    # VaR/CVaR 단순 파라메트릭용 일일 변동성 가정 (%). 1 = 1%. 0 또는 미설정 시 VaR/CVaR 미산출
    var-daily-vol-pct: ${INVESTMENT_RISK_VAR_DAILY_VOL_PCT:1}
    # 거시경제 지표 API URL (선택). GET JSON 예: {"vix": 18.5}. 미설정 시 VIX 미제공.
    macro-indicator-url: ${INVESTMENT_RISK_MACRO_INDICATOR_URL:}
    # 리스크 이벤트 알림: 일일 손실 한도 대비 이 비율(0~1) 도달 시 알림. 0.8 = 80% 도달 시
    alert-mdd-threshold-pct: ${INVESTMENT_RISK_ALERT_MDD_THRESHOLD_PCT:0.8}
    # 리스크 이벤트 알림: VaR 95% 초과 시 Discord 알림 사용 여부
    alert-var-exceed-enabled: ${INVESTMENT_RISK_ALERT_VAR_EXCEED_ENABLED:true}
    # P6-1 드로다운 회복 모드: MDD가 이 값(0~1) 이상이면 회복 모드 ON. 0.10 = 10%
    drawdown-recovery-threshold-pct: ${INVESTMENT_RISK_DRAWDOWN_RECOVERY_THRESHOLD_PCT:0.10}
    # 회복 모드 해제: MDD가 이 값 이하로 회복되면 정상. 0.05 = 5%
    drawdown-recovery-exit-pct: ${INVESTMENT_RISK_DRAWDOWN_RECOVERY_EXIT_PCT:0.05}
    # 회복 모드 시 신규 매수 권장 금액 스케일 (0~1). 0.5 = 50%
    drawdown-recovery-scale: ${INVESTMENT_RISK_DRAWDOWN_RECOVERY_SCALE:0.5}
    # 단기(5일) 열화 시 자본 절반 제한. 데이터 연동 전에는 비활성(1.0 배율)
    capital-drawdown-constraint-enabled: ${INVESTMENT_RISK_CAPITAL_DRAWDOWN_CONSTRAINT_ENABLED:true}
    # Monte Carlo 시뮬레이션 설정 (P0: 헤지펀드급 리스크 분석)
    montecarlo:
      scenarios: ${INVESTMENT_RISK_MC_SCENARIOS:10000}              # 시뮬레이션 시나리오 수
      distribution: ${INVESTMENT_RISK_MC_DISTRIBUTION:STUDENT_T}    # NORMAL | STUDENT_T (팻테일)
      degrees-of-freedom: ${INVESTMENT_RISK_MC_DF:5}                # Student-t 자유도 (낮을수록 팻테일 강화)
      parallel-threads: ${INVESTMENT_RISK_MC_THREADS:4}             # 병렬 처리 스레드 수
      min-samples: ${INVESTMENT_RISK_MC_MIN_SAMPLES:60}             # 최소 필요 샘플 수
      default-confidence-level: ${INVESTMENT_RISK_MC_CONFIDENCE:0.95}
      async-timeout-seconds: ${INVESTMENT_RISK_MC_TIMEOUT:60}
  # 전략 거버넌스: 정기 백테스트·MDD/Sharpe 열화 시 Discord 알림 (매월 1일 02:00 KST, 수동 트리거 가능)
  governance:
    enabled: ${INVESTMENT_GOVERNANCE_ENABLED:true}
    lookback-months: ${INVESTMENT_GOVERNANCE_LOOKBACK_MONTHS:12}
    mdd-threshold-pct: ${INVESTMENT_GOVERNANCE_MDD_THRESHOLD_PCT:-15}
    sharpe-min: ${INVESTMENT_GOVERNANCE_SHARPE_MIN:0}
    default-capital: ${INVESTMENT_GOVERNANCE_DEFAULT_CAPITAL:100000000}
    alert-only: ${INVESTMENT_GOVERNANCE_ALERT_ONLY:true}
    # 2차: 열화 시 (market, strategyType)별 halt 등록. true이고 alert-only=false일 때만 halt 등록 (기본 false)
    auto-halt-on-degradation: ${INVESTMENT_GOVERNANCE_AUTO_HALT_ON_DEGRADATION:true}
    # 팩터 열화 모니터: 최근 N개월 5일 수익률 Sharpe 미달 시 Discord 알림 (factor-decay-check Job)
    factor-decay-lookback-months: ${INVESTMENT_GOVERNANCE_FACTOR_DECAY_LOOKBACK_MONTHS:3}
    factor-decay-sharpe-min: ${INVESTMENT_GOVERNANCE_FACTOR_DECAY_SHARPE_MIN:0.5}
  # 4단계 파이프라인 실행. auto-execute=false 시 주문 생성 없이 dry-run만. 기본 false(문서 §6.2).
  pipeline:
    auto-execute: ${PIPELINE_AUTO_EXECUTE:true}
    # true 시 PipelineOrderExecutor(알고리즘 실행) 사용. 기본은 단일 주문(OrderService)
    use-algo-execution: ${PIPELINE_USE_ALGO_EXECUTION:true}
    # 실전 계좌(serverType=0) 자동 실행 허용. false면 모의계좌만 실제 주문 실행.
    allow-real-execution: ${PIPELINE_ALLOW_REAL_EXECUTION:false}
    execution-schedule-cron: ${PIPELINE_EXECUTION_SCHEDULE_CRON:0 10 9 * * *}  # 한국장 유리 구간 (09:10 KST)
    execution-schedule-cron-kr-afternoon: ${PIPELINE_EXECUTION_SCHEDULE_CRON_KR_AFTERNOON:0 35 14 * * MON-FRI}  # 한국장 마감 1시간 (14:35 KST)
    execution-schedule-cron-us-close: ${PIPELINE_EXECUTION_SCHEDULE_CRON_US_CLOSE:0 5 5 * * MON-FRI}  # 미국장 마감 직전 (05:05 KST)
    # 퀀트 매매 유리 시간대: 해당 구간에만 진입 실행. 14-trading-window-quant.md 참조.
    trading-window:
      enabled: ${PIPELINE_TRADING_WINDOW_ENABLED:true}
      avoid-volatile-window: ${PIPELINE_AVOID_VOLATILE_WINDOW:true}
      kr:
        start: ${PIPELINE_TRADING_WINDOW_KR_START:09:00}
        end: ${PIPELINE_TRADING_WINDOW_KR_END:10:00}
        start2: ${PIPELINE_TRADING_WINDOW_KR_START2:14:30}
        end2: ${PIPELINE_TRADING_WINDOW_KR_END2:15:30}
      us:
        start: ${PIPELINE_TRADING_WINDOW_US_START:23:30}
        end: ${PIPELINE_TRADING_WINDOW_US_END:01:00}
        start2: ${PIPELINE_TRADING_WINDOW_US_START2:05:00}
        end2: ${PIPELINE_TRADING_WINDOW_US_END2:06:00}
    exit-schedule-cron: ${PIPELINE_EXIT_SCHEDULE_CRON:0 */5 9-15 * * MON-FRI}  # 장중 5분마다 청산 평가 (09:00~15:59, 평일)
    fill-confirmation-cron: ${PIPELINE_FILL_CONFIRMATION_CRON:0 * * * * *}  # 매분 체결 확인 후 포지션 등록
    medium-term-rebalance-cron: ${PIPELINE_MEDIUM_TERM_REBALANCE_CRON:0 30 8 1 * *}  # 매월 1일 08:30 KST (스텁)
    scheduler:
      default-capital: ${PIPELINE_SCHEDULER_DEFAULT_CAPITAL:0}  # 스케줄러용 총자산(원), 0이면 실행 스킵
    atr-trailing-stop-multiplier: ${PIPELINE_ATR_TRAILING_STOP_MULTIPLIER:2.0}  # ATR Trailing Stop 배수 (2.0~2.5 권장)
    short-term-trailing-pct: ${PIPELINE_SHORT_TERM_TRAILING_PCT:3}   # 단기 고점 대비 Trailing Stop 하락률 (%)
    short-term-kr-stop-loss-pct: ${PIPELINE_SHORT_TERM_KR_STOP_LOSS_PCT:5}  # 한국(KR) 단기/스윙 진입가 대비 -5% 고정 손절 (%)
    prior-low-stop-kr-enabled: ${PIPELINE_PRIOR_LOW_STOP_KR_ENABLED:true}  # 한국(KR) 전저점 이탈 손절 사용 여부
    rsi-exit-threshold: ${PIPELINE_RSI_EXIT_THRESHOLD:70}  # 한국(KR) RSI≥N 익절 임계값 (0~100)
    medium-term-stop-loss-pct: ${PIPELINE_MEDIUM_TERM_STOP_LOSS_PCT:10}  # 중기 개별 손절 하락률 (%)
    register-position-on-execution: ${PIPELINE_REGISTER_POSITION_ON_EXECUTION:true}  # true면 체결 확인 후 포지션 등록, false면 주문 성공 시 즉시 등록
    # 미체결 N분 경과 시 Discord 긴급 알림 (Webhook URL, env PIPELINE_ALERT_DISCORD_WEBHOOK_URL 권장). 채널 미설정 시 이 URL로 폴백.
    alert-discord-webhook-url: ${PIPELINE_ALERT_DISCORD_WEBHOOK_URL:}
    # 긴급 알림 시 앱 내 주문/계좌 화면 base URL (env 권장)
    alert-base-url: ${PIPELINE_ALERT_BASE_URL:}
    # 미체결 확인 대기 분 (기본 1분)
    unfilled-check-minutes: ${PIPELINE_UNFILLED_CHECK_MINUTES:1}
    # 동일 주문 미체결 Discord 알림 쿨타임(분). 30분 내 중복 알림 방지
    unfilled-alert-cooldown-minutes: ${PIPELINE_UNFILLED_ALERT_COOLDOWN_MINUTES:30}
    # KR 시초가/변동성 돌파 시 주문구분(ORD_DVSN). 미설정 또는 빈값이면 지정가(00). 02=최유리, 03=IOC. §6.2 항목 3.
    kr-opening-order-dvsn: ${PIPELINE_KR_OPENING_ORDER_DVSN:}
    # 동적 리밸런싱 (P2-2). 비중 이탈(drift) > 임계값 시 자동 리밸런스
    drift-tolerance-pct: ${PIPELINE_DRIFT_TOLERANCE_PCT:0.05}
    drift-rebalance-enabled: ${PIPELINE_DRIFT_REBALANCE_ENABLED:true}
  # Discord 알림 채널 분리 (P6-4). 미설정 시 pipeline.alert-discord-webhook-url 폴백.
  alert:
    discord:
      trade-webhook: ${INVESTMENT_ALERT_DISCORD_TRADE_WEBHOOK:}
      risk-webhook: ${INVESTMENT_ALERT_DISCORD_RISK_WEBHOOK:}
      system-webhook: ${INVESTMENT_ALERT_DISCORD_SYSTEM_WEBHOOK:}
  # 장중 변동성 돌파 (P2). 09:00~10:00 구간에서 돌파 종목 1회 매수
  intraday:
    breakout-enabled: ${INVESTMENT_INTRADAY_BREAKOUT_ENABLED:true}
    breakout-schedule-cron: ${INVESTMENT_INTRADAY_BREAKOUT_CRON:0 10,40 9 * * MON-FRI}
    breakout-max-positions: ${INVESTMENT_INTRADAY_BREAKOUT_MAX_POSITIONS:3}
    breakout-position-pct: ${INVESTMENT_INTRADAY_BREAKOUT_POSITION_PCT:0.005}
  # 포지션 정합성(Reconciliation). 자동투자 ON 계좌별 브로커-DB 비교, 불일치 시 Discord 알림
  reconciliation:
    enabled: ${INVESTMENT_RECONCILIATION_ENABLED:true}
    alert-on-mismatch: ${INVESTMENT_RECONCILIATION_ALERT_ON_MISMATCH:true}
  # 일일 PnL 집계·리뷰 (P3). 장 마감 후 계좌별 당일 수익률 기록
  daily-pnl:
    schedule-cron: ${INVESTMENT_DAILY_PNL_SCHEDULE_CRON:0 5 16 * * MON-FRI}
  # 로보어드바이저 동적 자산배분 백테스트·실행 전 검증
  backtest:
    robo:
      asset-symbols: ${ROBO_ASSET_SYMBOLS:SPY,IEF,TLT,GLD,DBC,BIL}
      momentum-months: ${ROBO_MOMENTUM_MONTHS:12}
      ma-window-days: ${ROBO_MA_WINDOW_DAYS:200}
      top-n: ${ROBO_TOP_N:4}
      rebalance-frequency: ${ROBO_REBALANCE_FREQUENCY:MONTHLY}
      drift-threshold-pct: ${ROBO_DRIFT_THRESHOLD_PCT:5}
      comm-pct: ${ROBO_COMM_PCT:0.1}
      slip-pct: ${ROBO_SLIP_PCT:0.2}
      risk-free-rate-pct: ${ROBO_RISK_FREE_RATE_PCT:0}
      benchmark-weights: ${ROBO_BENCHMARK_WEIGHTS:SPY=0.6,TLT=0.4}
      volatility-lookback-days: ${ROBO_VOLATILITY_LOOKBACK_DAYS:60}
      # 실행 전 백테스트 (리밸런싱 직전 Go/No-Go)
      pre-execution-lookback-months: ${ROBO_PRE_EXECUTION_LOOKBACK_MONTHS:12}
      pre-execution-max-mdd-pct: ${ROBO_PRE_EXECUTION_MAX_MDD_PCT:15}
      pre-execution-min-sharpe: ${ROBO_PRE_EXECUTION_MIN_SHARPE:0.5}
      rebalance-schedule-cron: ${ROBO_REBALANCE_SCHEDULE_CRON:0 0 9 L * *}  # 매월 말일 09:00 KST
      # 듀얼 모멘텀(노트) 모드: MULTI_ASSET(기존), DUAL_MOMENTUM_NOTE(절대 SPY 12M vs T-bill + 상대 섹터 6M 상위 2개)
      dual-momentum-mode: ${ROBO_DUAL_MOMENTUM_MODE:MULTI_ASSET}
      sector-etf-symbols: ${ROBO_SECTOR_ETF_SYMBOLS:XLK,XLE,XLF,XLV,XLI,XLY,XLP,XLB}
      momentum-months-relative: ${ROBO_MOMENTUM_MONTHS_RELATIVE:6}
      top-n-sector: ${ROBO_TOP_N_SECTOR:2}
      absolute-momentum-symbol: ${ROBO_ABSOLUTE_MOMENTUM_SYMBOL:SPY}
      risk-free-symbol: ${ROBO_RISK_FREE_SYMBOL:BIL}
      rebalance-execution-price: ${ROBO_REBALANCE_EXECUTION_PRICE:CLOSE}
      # 실제 ETF 주문 실행 여부. false면 목표 비중 로깅만
      execute-orders: ${ROBO_EXECUTE_ORDERS:true}
      min-order-amount-usd: ${ROBO_MIN_ORDER_AMOUNT_USD:50}
  # 트레이딩 포트폴리오 (일별 추천 목록). 파이프라인 시그널 기반 생성 시 사용하는 기본 자본(원).
  trading-portfolio:
    default-capital: ${TRADING_PORTFOLIO_DEFAULT_CAPITAL:100000000}  # 1억 원
    max-items: ${TRADING_PORTFOLIO_MAX_ITEMS:20}  # 기준 통과 종목만 포함, 표시 상한(항상 5개 아님)
  # 보안 설정
  security:
    encryption-key: ${INVESTMENT_ENCRYPTION_KEY:}  # AES-256 키 (Base64 인코딩)
    jwt-secret: ${INVESTMENT_JWT_SECRET:default-secret-key-change-in-production-minimum-256-bits}
    jwt-expiration: ${INVESTMENT_JWT_EXPIRATION:3600000}  # 1시간 (밀리초)
    # 슈퍼관리자: 비밀번호·모의/실계좌 동기화. 설정 시 기동 시 한 번만 갱신 (역할은 시드/마이그레이션에서 Admin 설정)
    super-admin:
      username: ${SUPER_ADMIN_USERNAME:}
      password: ${SUPER_ADMIN_PASSWORD:}
      # 모의계좌 (한국투자증권, serverType=1). app-key·app-secret 둘 다 있으면 API 키·계좌 동기화
      virtual:
        app-key: ${SUPER_ADMIN_VIRTUAL_APP_KEY:}
        app-secret: ${SUPER_ADMIN_VIRTUAL_APP_SECRET:}
        account-no: ${SUPER_ADMIN_VIRTUAL_ACCOUNT_NO:}
      # 실계좌 (한국투자증권, serverType=0)
      real:
        app-key: ${SUPER_ADMIN_REAL_APP_KEY:}
        app-secret: ${SUPER_ADMIN_REAL_APP_SECRET:}
        account-no: ${SUPER_ADMIN_REAL_ACCOUNT_NO:}
    # 최초 관리자 부트스트랩. ADMIN 0건일 때만 1회 생성 (enabled + username + password 설정 시)
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  market-data:
    provider: ${MARKET_DATA_PROVIDER:korea-investment}
    timeout: ${MARKET_DATA_TIMEOUT:30000}
    # 현재가 캐시 TTL(초). 기본 300(5분). 단타/청산/WebSocket 활성화 시 5 등 짧은 TTL 설정 권장
    current-price-cache-ttl-seconds: ${MARKET_DATA_CURRENT_PRICE_CACHE_TTL_SECONDS:300}
    # 한국투자증권 API 설정
    # [주의] app-key/app-secret/server-type은 계정별로 DB에서 관리됨
    # - SUPER_ADMIN: env의 SUPER_ADMIN_VIRTUAL_*/SUPER_ADMIN_REAL_*로 설정 (SuperAdminSeeder가 DB 동기화)
    # - 일반 사용자: 회원가입 시 직접 입력하여 DB에 저장
    # - server-type: 화면 토글 시 해당 계좌의 serverType 자동 인식
    korea-investment:
      # app-key, app-secret, server-type은 계정별 DB에서 관리 (env 미사용)
      use-token-cache: ${KOREA_INVESTMENT_USE_TOKEN_CACHE:true}
      # 장 시작 30분 전 토큰 자동 갱신 (08:30 KST, 평일)
      token:
        pre-market-refresh-enabled: ${KOREA_INVESTMENT_PRE_MARKET_REFRESH_ENABLED:true}
        pre-market-refresh-cron: ${KOREA_INVESTMENT_PRE_MARKET_REFRESH_CRON:0 30 8 * * MON-FRI}
      # 주문 API Throttling·큐 (실전 초당 2~10회, 모의 2회 제한 준수)
      throttle:
        enabled: ${KOREA_INVESTMENT_THROTTLE_ENABLED:true}
        orders-per-second: ${KOREA_INVESTMENT_ORDERS_PER_SECOND:5}
        queue-max-size: ${KOREA_INVESTMENT_ORDER_QUEUE_MAX_SIZE:500}
        reject-when-full: ${KOREA_INVESTMENT_ORDER_REJECT_WHEN_FULL:true}
      # 순위분석·투자자 매매동향 (path/TR_ID: 09-korea-investment-api-guide.md §순위분석·투자자 API 참조)
      # 실전 사용 시 volume-rank-tr-id: FHPST01710000, investor-daily-tr-id: FHPST03010100 로 오버라이드
      rank-api:
        volume-rank-path: ${KOREA_INVESTMENT_VOLUME_RANK_PATH:/uapi/domestic-stock/v1/quotations/volume-rank}
        volume-rank-tr-id: ${KOREA_INVESTMENT_VOLUME_RANK_TR_ID:FHKST01710000}
        investor-daily-path: ${KOREA_INVESTMENT_INVESTOR_DAILY_PATH:/uapi/domestic-stock/v1/quotations/inquire-investor-daily-by-market}
        investor-daily-tr-id: ${KOREA_INVESTMENT_INVESTOR_DAILY_TR_ID:FHKST03010100}
      # WebSocket 실시간 호가·체결통보 (enabled=true 시 실제 구현체 사용). base URL은 ops 호스트 사용(openapi/openapivts는 REST 전용)
      websocket:
        enabled: ${KOREA_INVESTMENT_WEBSOCKET_ENABLED:true}
        base-url-real: ${KOREA_INVESTMENT_WEBSOCKET_BASE_URL_REAL:ws://ops.koreainvestment.com:21000}
        base-url-virtual: ${KOREA_INVESTMENT_WEBSOCKET_BASE_URL_VIRTUAL:ws://ops.koreainvestment.com:31000}
        path: ${KOREA_INVESTMENT_WEBSOCKET_PATH:/tryitout}
        quote-tr-id: ${KOREA_INVESTMENT_WEBSOCKET_QUOTE_TR_ID:H0GASP0}
        ccnl-notice-tr-id: ${KOREA_INVESTMENT_WEBSOCKET_CCNL_NOTICE_TR_ID:H0GAMT0}
        connect-wait-ms: ${KOREA_INVESTMENT_WEBSOCKET_CONNECT_WAIT_MS:1000}
        subscription-interval-ms: ${KOREA_INVESTMENT_WEBSOCKET_SUBSCRIPTION_INTERVAL_MS:200}
        approval-key: ${KOREA_INVESTMENT_WEBSOCKET_APPROVAL_KEY:}
        approval-key-fetch-enabled: ${KOREA_INVESTMENT_WEBSOCKET_APPROVAL_KEY_FETCH_ENABLED:false}
        # 장 시작 전 연결·구독 크론 (비우면 기동 후 1회만 연결). 기본 08:50 KST 평일
        connect-cron: ${KOREA_INVESTMENT_WEBSOCKET_CONNECT_CRON:0 50 8 * * MON-FRI}
        # 장 종료 후 연결 해제 크론. 기본 15:35 KST 평일
        disconnect-cron: ${KOREA_INVESTMENT_WEBSOCKET_DISCONNECT_CRON:0 35 15 * * MON-FRI}
  trading:
    max-investment-amount: ${MAX_INVESTMENT_AMOUNT:1000000}
    min-investment-amount: ${MIN_INVESTMENT_AMOUNT:10000}
    default-currency: USD
    # 전략 비중 동적 결정 (시장 레짐별 단기/중기/장기 목표 비중). 레짐 미판별 시 default 사용
    strategy-weights:
      enabled: ${STRATEGY_WEIGHTS_ENABLED:true}
      min-weight: 0.05
      max-weight: 0.55
      regime-weights:
        HIGH_VOLATILITY:
          short-pct: 0.10
          mid-pct: 0.35
          long-pct: 0.55
        MODERATE_VOLATILITY:
          short-pct: 0.15
          mid-pct: 0.40
          long-pct: 0.45
        RECESSION:
          short-pct: 0.10
          mid-pct: 0.30
          long-pct: 0.60
        GROWTH:
          short-pct: 0.25
          mid-pct: 0.40
          long-pct: 0.35
        NORMAL:
          short-pct: 0.20
          mid-pct: 0.40
          long-pct: 0.40
        LOW_VOLATILITY:
          short-pct: 0.25
          mid-pct: 0.40
          long-pct: 0.35
        HIGH_INTEREST_RATE:
          short-pct: 0.15
          mid-pct: 0.38
          long-pct: 0.47
        HIGH_INFLATION:
          short-pct: 0.15
          mid-pct: 0.38
          long-pct: 0.47
        default:
          short-pct: 0.20
          mid-pct: 0.40
          long-pct: 0.40
  # AI 서비스 설정
  ai:
    prediction-service:
      url: ${AI_PREDICTION_SERVICE_URL:http://localhost:8000}
      timeout: ${AI_PREDICTION_SERVICE_TIMEOUT:5000}
      retry-max-attempts: ${AI_PREDICTION_SERVICE_RETRY_MAX_ATTEMPTS:3}
      enabled: ${AI_PREDICTION_SERVICE_ENABLED:true}
      # LSTM 모델 파일 경로는 예측 서비스(Python) 환경변수 MODEL_PATH 또는 LSTM_MODEL_PATH로 설정
    strategy-optimizer:
      url: ${AI_STRATEGY_OPTIMIZER_URL:http://localhost:8001}
      timeout: ${AI_STRATEGY_OPTIMIZER_TIMEOUT:10000}
      enabled: ${AI_STRATEGY_OPTIMIZER_ENABLED:false}
    nlp-service:
      url: ${AI_NLP_SERVICE_URL:http://localhost:8002}
      timeout: ${AI_NLP_SERVICE_TIMEOUT:5000}
      enabled: ${AI_NLP_SERVICE_ENABLED:false}

# Resilience4j Circuit Breaker 설정
resilience4j:
  circuitbreaker:
    configs:
      default:
        failureRateThreshold: 50
        minimumNumberOfCalls: 10
        slidingWindowSize: 100
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 5
        slidingWindowType: COUNT_BASED
    instances:
      aiPredictionService:
        baseConfig: default
        failureRateThreshold: 60
        waitDurationInOpenState: 30s
      marketDataService:
        baseConfig: default
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
      orderService:
        baseConfig: default
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
    instances:
      aiPredictionService:
        baseConfig: default
        timeoutDuration: 3s
      marketDataService:
        baseConfig: default
        timeoutDuration: 5s
      orderService:
        baseConfig: default
        timeoutDuration: 5s
  ratelimiter:
    configs:
      default:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0
      # 한국투자증권 API Rate Limit 설정
      koreaInvestmentReal:
        # 실전투자: 1초당 20건 (안전 마진을 위해 18건으로 설정)
        limitForPeriod: 18
        limitRefreshPeriod: 1s
        timeoutDuration: 5s
      koreaInvestmentVirtual:
        # 모의투자: 1초당 2건 (안전 마진을 위해 1건으로 설정)
        limitForPeriod: 1
        limitRefreshPeriod: 1s
        timeoutDuration: 5s
      koreaInvestmentToken:
        # 토큰 발급: 1초당 1건
        limitForPeriod: 1
        limitRefreshPeriod: 1s
        timeoutDuration: 5s
    instances:
      koreaInvestmentApi:
        baseConfig: koreaInvestmentVirtual  # 기본값: 모의투자
      koreaInvestmentApiReal:
        baseConfig: koreaInvestmentReal  # 실전투자용
      koreaInvestmentToken:
        baseConfig: koreaInvestmentToken
