spring:
  application:
    name: investment-choi
  profiles:
    active: local
  
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/investment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:investment}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MariaDBDialect
    open-in-view: false
  
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
  
  # Redis 설정
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  
  # 캐싱 설정
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10분
      cache-null-values: false

server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  level:
    root: INFO
    com.investment: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /LOG/investment-choi.log
    max-size: 100MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

investment:
  # 보안 설정
  security:
    encryption-key: ${INVESTMENT_ENCRYPTION_KEY:}  # AES-256 키 (Base64 인코딩)
    jwt-secret: ${INVESTMENT_JWT_SECRET:default-secret-key-change-in-production-minimum-256-bits}
    jwt-expiration: ${INVESTMENT_JWT_EXPIRATION:3600000}  # 1시간 (밀리초)
  market-data:
    provider: ${MARKET_DATA_PROVIDER:korea-investment}
    timeout: ${MARKET_DATA_TIMEOUT:30000}
    use-mock-data: ${MARKET_DATA_USE_MOCK_DATA:false}
    # 한국투자증권 API 설정 (이제 사용자별로 DB에서 관리)
    korea-investment:
      app-key: ${KOREA_INVESTMENT_APP_KEY:}
      app-secret: ${KOREA_INVESTMENT_APP_SECRET:}
      server-type: ${KOREA_INVESTMENT_SERVER_TYPE:1}  # 1: 모의투자, 0: 실거래
      use-token-cache: ${KOREA_INVESTMENT_USE_TOKEN_CACHE:true}
  trading:
    max-investment-amount: ${MAX_INVESTMENT_AMOUNT:1000000}
    min-investment-amount: ${MIN_INVESTMENT_AMOUNT:10000}
    default-currency: USD
  # AI 서비스 설정
  ai:
    prediction-service:
      url: ${AI_PREDICTION_SERVICE_URL:http://localhost:8000}
      timeout: ${AI_PREDICTION_SERVICE_TIMEOUT:5000}
      retry-max-attempts: ${AI_PREDICTION_SERVICE_RETRY_MAX_ATTEMPTS:3}
      enabled: ${AI_PREDICTION_SERVICE_ENABLED:true}
    strategy-optimizer:
      url: ${AI_STRATEGY_OPTIMIZER_URL:http://localhost:8001}
      timeout: ${AI_STRATEGY_OPTIMIZER_TIMEOUT:10000}
      enabled: ${AI_STRATEGY_OPTIMIZER_ENABLED:false}
    nlp-service:
      url: ${AI_NLP_SERVICE_URL:http://localhost:8002}
      timeout: ${AI_NLP_SERVICE_TIMEOUT:5000}
      enabled: ${AI_NLP_SERVICE_ENABLED:false}

# Resilience4j Circuit Breaker 설정
resilience4j:
  circuitbreaker:
    configs:
      default:
        failureRateThreshold: 50
        minimumNumberOfCalls: 10
        slidingWindowSize: 100
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 5
        slidingWindowType: COUNT_BASED
    instances:
      aiPredictionService:
        baseConfig: default
        failureRateThreshold: 60
        waitDurationInOpenState: 30s
      marketDataService:
        baseConfig: default
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
    instances:
      aiPredictionService:
        baseConfig: default
        timeoutDuration: 3s
      marketDataService:
        baseConfig: default
        timeoutDuration: 5s
  ratelimiter:
    configs:
      default:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0
      # 한국투자증권 API Rate Limit 설정
      koreaInvestmentReal:
        # 실전투자: 1초당 20건 (안전 마진을 위해 18건으로 설정)
        limitForPeriod: 18
        limitRefreshPeriod: 1s
        timeoutDuration: 5s
      koreaInvestmentVirtual:
        # 모의투자: 1초당 2건 (안전 마진을 위해 1건으로 설정)
        limitForPeriod: 1
        limitRefreshPeriod: 1s
        timeoutDuration: 5s
      koreaInvestmentToken:
        # 토큰 발급: 1초당 1건
        limitForPeriod: 1
        limitRefreshPeriod: 1s
        timeoutDuration: 5s
    instances:
      koreaInvestmentApi:
        baseConfig: koreaInvestmentVirtual  # 기본값: 모의투자
      koreaInvestmentApiReal:
        baseConfig: koreaInvestmentReal  # 실전투자용
      koreaInvestmentToken:
        baseConfig: koreaInvestmentToken
