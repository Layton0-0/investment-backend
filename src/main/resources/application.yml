spring:
  application:
    name: investment-choi
  profiles:
    active: local
  
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/investment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:investment}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MariaDBDialect
    open-in-view: false
  
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  level:
    root: INFO
    com.investment: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /LOG/investment-choi.log
    max-size: 100MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

investment:
  market-data:
    provider: ${MARKET_DATA_PROVIDER:finnhub}
    api-key: ${MARKET_DATA_API_KEY:}
    base-url: ${MARKET_DATA_BASE_URL:https://finnhub.io/api/v1}
    timeout: ${MARKET_DATA_TIMEOUT:30000}
    use-mock-data: ${MARKET_DATA_USE_MOCK_DATA:false}
    # 키움증권 API 설정 (provider가 kiwoom일 때 사용)
    kiwoom:
      account-no: ${KIWOOM_ACCOUNT_NO:}
      password: ${KIWOOM_PASSWORD:}
      server-type: ${KIWOOM_SERVER_TYPE:1}  # 1: 모의투자, 0: 실거래
      host: ${KIWOOM_HOST:localhost}
      port: ${KIWOOM_PORT:5000}
      auto-login: ${KIWOOM_AUTO_LOGIN:false}
  trading:
    max-investment-amount: ${MAX_INVESTMENT_AMOUNT:1000000}
    min-investment-amount: ${MIN_INVESTMENT_AMOUNT:10000}
    default-currency: USD
