plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.2'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'jacoco'
}

group = 'com.investment'
version = '2.0.0'
sourceCompatibility = '17'

// Agent/Cursor 전용: build 폴더는 IntelliJ용. 임시 빌드는 고정 경로 agent-build(같은 루트, JaCoCo 호환) 사용 후 스크립트에서 삭제.
// Windows에서 1회차 test 시 삭제 잠금 시 2회차 재실행으로 회피 가능.
// 사용: .\scripts\run-tests.ps1 또는 run-tests-with-coverage.ps1 (GRADLE_UNIQUE_BUILD_DIR=1)
if (System.getenv('GRADLE_UNIQUE_BUILD_DIR') != null && !System.getenv('GRADLE_UNIQUE_BUILD_DIR').isEmpty()) {
    buildDir = file("${projectDir}/agent-build")
    gradle.buildFinished {
        if (buildDir?.exists()) {
            new File(projectDir, '.agent-build-dir').text = buildDir.absolutePath
        }
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    
    // Reactive Web (비동기 처리)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    
    // Redis (캐싱 및 실시간 데이터)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    
    // Database - MariaDB 11.8.5 호환
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.3.3'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // JSON Processing
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    
    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    
    // Password Encoding
    implementation 'org.springframework.security:spring-security-crypto'
    
    // OpenAPI/Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
    
    // Circuit Breaker (Resilience4j)
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.1.0'
    implementation 'io.github.resilience4j:resilience4j-reactor:2.1.0'
    
    // Observability
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'io.projectreactor:reactor-test'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    if (System.getenv('GRADLE_UNIQUE_BUILD_DIR') != null && !System.getenv('GRADLE_UNIQUE_BUILD_DIR').isEmpty()) {
        maxParallelForks = 1
        forkEvery = 0
    }
}

jacoco {
    toolVersion = '0.8.11'
}

def jacocoExcludes = [
    'com/investment/InvestmentApplication.class',
    'com/investment/**/config/**',
    'com/investment/**/dto/**',
    'com/investment/**/domain/entity/**',
    '**/*Dto.class',
    '**/*DTO.class',
    '**/MenuItem.class',
    '**/ErrorCode.class',
    '**/ErrorResponse.class',
    '**/Role.class',
    '**/BrokerType.class',
    '**/StrategyStatus.class',
    '**/StrategyType.class'
]

tasks.named('jacocoTestReport') {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/test/html')
    }
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn jacocoTestReport
    executionData.from(file("${layout.buildDirectory.get().asFile}/jacoco/test.exec"))
    sourceSets sourceSets.main
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
        rule {
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}
